    else { out+=c; continue; }
    if(isUp(c) && t){ t = (isUp(next) || (isUp(prev) && !isL(next))) ? t.toUpperCase() : t.charAt(0).toUpperCase()+t.slice(1); }

}

/* ---------------- перевірки ---------------- */
function checkEdrpou(c){
  if(!/^\d{8}$/.test(c)) return false;
  const d=[...c].map(Number), n=Number(c);
  const w=(n<30000000||n>60000000)?[1,2,3,4,5,6,7]:[7,1,2,3,4,5,6];
  let s=w.reduce((a,x,i)=>a+x*d[i],0)%11;
  if(s>=10){ s=w.map(x=>x+2).reduce((a,x,i)=>a+x*d[i],0)%11; if(s>=10) s=0; }
  return s===d[7];
}
function checkRnokpp(c){
  if(!/^\d{10}$/.test(c)) return false;
  const d=[...c].map(Number), w=[-1,5,7,9,4,6,10,5,7];
  const s=w.reduce((a,x,i)=>a+x*d[i],0);
  return ((s%11)+11)%11%10===d[9];
}
function checkIban(v){
  const s=String(v||'').replace(/\s/g,'').toUpperCase();
  if(!/^[A-Z]{2}\d{2}[A-Z0-9]{10,30}$/.test(s)) return false;
  if(s.startsWith('UA') && s.length!==29) return false;
  const r=(s.slice(4)+s.slice(0,4)).replace(/[A-Z]/g,c=>String(c.charCodeAt(0)-55));
  let m=0; for(const c of r) m=(m*10+Number(c))%97;
  return m===1;
}
const checkEmail = v => /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(String(v||'').trim());
// {error} — блокує збереження; {warn} — лише попередження
function taxIdIssue(t, person){
  const v=String(t||'').replace(/\s/g,'');
  if(!v) return null;
  if(!/^\d+$/.test(v)) return {error:'Лише цифри'};
  if(v.length===8){ if(person) return {warn:'Для фізичної особи зазвичай 10 цифр (РНОКПП)'}; return checkEdrpou(v)?null:{warn:'Контрольна цифра ЄДРПОУ не збігається — перевірте код'}; }
  if(v.length===10) return checkRnokpp(v)?null:{warn:'Контрольна цифра РНОКПП не збігається — перевірте код'};

  const login=async()=>{ setErr(''); setBusy(true); const {error}=await sb.auth.signInWithPassword({email:email.trim(),password:pw}); setBusy(false);
    if(error) setErr(/Invalid login/i.test(error.message)?'Невірний email або пароль':errText(error)); };
  return html`<div class="auth"><div class="box">
    <${Brand} size=${30}/>
    <div class="fld"><label>Email</label><input value=${email} onInput=${e=>setEmail(e.target.value)} onKeyDown=${e=>e.key==='Enter'&&login()} autocomplete="username"/></div>
    <div class="fld"><label>Пароль</label><input type="password" value=${pw} onInput=${e=>setPw(e.target.value)} onKeyDown=${e=>e.key==='Enter'&&login()} autocomplete="current-password"/></div>
    ${err&&html`<div style="color:var(--red-t);font-size:13px;margin-bottom:10px">${err}</div>`}
    <button class="btn primary" style="width:100%;justify-content:center" onClick=${login} disabled=${busy}>${busy?html`<${Spinner}/>`:'Увійти'}</button>
    <div class="ver" style="text-align:center;padding:12px 0 0">версія ${APP_VERSION}</div>
  </div></div>`;
}

function Shell({session}){
  const [me,setMe]=useState(null); const [d,setD]=useState(null); const [openM,setOpenM]=useState(false); const [err,setErr]=useState('');
  const route=useRoute();
  const loadMe=async()=>{ setMe(null); setErr('');
    const {data,error}=await sb.from('profiles').select('id,email,full_name,role,active').eq('id',session.user.id).maybeSingle();
    if(error){ setErr(errText(error)); setMe({role:'none'}); return; }
    setMe(data && data.active!==false ? data : {...(data||{}), role:'none'});
  };
  const reloadDicts=async()=>{ try{ setD(await loadDicts()); } catch(e){ toastErr(e); } };
  useEffect(()=>{ loadMe(); },[]);
  useEffect(()=>{ if(me && roleL[me.role] && me.role!=='none') reloadDicts(); },[me&&me.role]);
  if(!me) return html`<div class="empty" style="padding-top:120px">Завантаження…</div>`;
  if(!can(me.role,'all')) return html`<${NoAccess} session=${session} onRetry=${loadMe}/>`;
  if(!d) return html`<div class="empty" style="padding-top:120px">${err||'Завантаження довідників…'}</div>`;
  const role=me.role, sec=route.path[0]||'home', id=route.path[1];
  const ctx={session, me, role, d, reloadDicts, reloadMe:loadMe};
  let content;
  if(sec==='home') content=html`<${Dashboard}/>`;
  else if(sec==='contracts') content = id==='new' ? html`<${NewContract} key=${'new'+(route.query.cp||'')} cpId=${route.query.cp}/>` : id ? html`<${ContractPage} key=${id} id=${id} tab=${route.query.tab||'overview'} gen=${route.query.gen}/>` : html`<${Registry} query=${route.query}/>`;
  else if(sec==='templates' && can(role,'legal')) content = id ? html`<${TemplatePage} key=${id} id=${id} vq=${route.query.v}/>` : html`<${TemplatesList}/>`;
  else if(sec==='counterparties') content = id ? html`<${CounterpartyPage} key=${id} id=${id} tab=${route.query.tab||'main'}/>` : html`<${CounterpartyList}/>`;
  else if(sec==='libraries' && can(role,'legal')) content=html`<${Libraries} tab=${route.query.tab||'projects'}/>`;
  else if(sec==='settings') content=html`<${Settings} tab=${route.query.tab||'profile'}/>`;
  else if(SOON[sec]) content=html`<${Placeholder} k=${sec}/>`;
  else content=html`<${Empty} title="Сторінку не знайдено"><a href="#/">На головну</a><//>`;
  return html`<${Ctx.Provider} value=${ctx}><div class="app">
    ${openM&&html`<div class="mback" onClick=${()=>setOpenM(false)}></div>`}
    <div class=${'side'+(openM?' open':'')}>
      <${Brand}/>
      ${MENU.filter(m=>can(role,m[2])).map(([k,l])=>html`<div class=${'nav'+(sec===k?' on':'')} key=${k} onClick=${()=>{go(k==='home'?'':k);setOpenM(false);}}>
        <span>${l}</span>${SOON[k]&&html`<span class="soon" title=${'Етап '+SOON[k].stage}>скоро</span>`}</div>`)}
      <div style="flex:1"></div>
      <div style="font-size:12.5px;color:var(--muted);padding:8px 10px"><div class="b" style="color:var(--text)">${me.full_name||me.email}</div><div>${roleL[role]}</div></div>
      <div class="ver">версія ${APP_VERSION}</div>
      <button class="btn sm" style="margin:0 10px" onClick=${()=>sb.auth.signOut()}>Вийти</button>
    </div>

function App(){
  const [session,setSession]=useState(undefined);
  const [toast,setToast]=useState(null);
  useEffect(()=>{ let t; toastFn=(m,k)=>{ clearTimeout(t); setToast({m,k}); t=setTimeout(()=>setToast(null),k==='err'?7000:3000); };
    sb.auth.getSession().then(({data})=>setSession(data.session));
    const {data:sub}=sb.auth.onAuthStateChange((_e,s)=>setSession(s));
    return ()=>sub.subscription.unsubscribe();
  },[]);
  if(session===undefined) return html`<div class="empty" style="padding-top:120px">Завантаження…</div>`;
  return html`${session?html`<${Shell} key=${session.user.id} session=${session}/>`:html`<${Auth}/>`}${toast&&html`<div class=${'toast'+(toast.k==='err'?' err':'')} onClick=${()=>setToast(null)}>${toast.m}</div>`}`;
}

/* ---- тексти для документів ---- */
const MONTHS_GEN = ['січня','лютого','березня','квітня','травня','червня','липня','серпня','вересня','жовтня','листопада','грудня'];
const dateTextUA = d => d ? `«${d.slice(8,10)}» ${MONTHS_GEN[+d.slice(5,7)-1]} ${d.slice(0,4)} р.` : '';
const fmtAmountDoc = v => { if(v==null||v==='') return ''; const n=Number(v); const [i,f]=Math.abs(n).toFixed(2).split('.'); return (n<0?'-':'')+i.replace(/\B(?=(\d{3})+(?!\d))/g,' ')+','+f; };
const CUR_DOC = {
  UAH:{short:'грн', main:['гривня','гривні','гривень'], fem:true, sub:['копійка','копійки','копійок'], subFem:true},
  USD:{short:'дол. США', main:['долар США','долари США','доларів США'], fem:false, sub:['цент','центи','центів'], subFem:false},
  EUR:{short:'євро', main:['євро','євро','євро'], fem:false, sub:['цент','центи','центів'], subFem:false},
};
function numWordsUA(n, fem){
  n = Math.floor(Math.abs(n)); if(n===0) return 'нуль';
  const U=['','один','два','три','чотири','п’ять','шість','сім','вісім','дев’ять'], UF=['','одна','дві','три','чотири','п’ять','шість','сім','вісім','дев’ять'];
  const T=['десять','одинадцять','дванадцять','тринадцять','чотирнадцять','п’ятнадцять','шістнадцять','сімнадцять','вісімнадцять','дев’ятнадцять'];
  const D=['','','двадцять','тридцять','сорок','п’ятдесят','шістдесят','сімдесят','вісімдесят','дев’яносто'];
  const H=['','сто','двісті','триста','чотириста','п’ятсот','шістсот','сімсот','вісімсот','дев’ятсот'];
  const tri=(x,f)=>{ const h=Math.floor(x/100), r=x%100, t=Math.floor(r/10), u=r%10, w=[]; if(h) w.push(H[h]); if(r>=10&&r<20) w.push(T[r-10]); else { if(t) w.push(D[t]); if(u) w.push((f?UF:U)[u]); } return w.join(' '); };
  const sc=[[null,fem],[['тисяча','тисячі','тисяч'],true],[['мільйон','мільйони','мільйонів'],false],[['мільярд','мільярди','мільярдів'],false],[['трильйон','трильйони','трильйонів'],false]];
  const out=[]; let i=0;
  while(n>0 && i<sc.length){ const x=n%1000; if(x){ const [forms,f]=sc[i]; const w=tri(x,f); out.unshift(forms ? w+' '+plural(x,...forms) : w); } n=Math.floor(n/1000); i++; }
  return out.join(' ');
}
function amountWordsUA(v, cur){
  if(v==null||v==='') return '';
  const c=CUR_DOC[cur]||CUR_DOC.UAH, n=Math.round(Math.abs(Number(v))*100), int=Math.floor(n/100), k=n%100;
  return `${numWordsUA(int,c.fem)} ${plural(int,...c.main)} ${String(k).padStart(2,'0')} ${plural(k,...c.sub)}`;
}
function termTextUA(c){
  const s=c.start_date, e=c.indefinite?null:c.end_date;
  if(c.indefinite) return s ? `з ${dateTextUA(s)} безстроково` : 'безстроково';
  if(s&&e) return `з ${dateTextUA(s)} по ${dateTextUA(e)}`;
  if(e) return `по ${dateTextUA(e)}`;
  return s ? `з ${dateTextUA(s)}` : '';
}
// «Петренко Іван Іванович» → «Іван ПЕТРЕНКО» (підпис)
function signName(full){
  const p=String(full||'').replace(/^\s*(ФОП|ФО|фізична особа-підприємець|фізична особа)\s+/i,'').trim().split(/\s+/).filter(Boolean);
  if(!p.length) return ''; if(p.length===1) return p[0].toUpperCase();
  return p[1]+' '+p[0].toUpperCase();
}
function cpKind(cp, lf){
  if(lf){ if(/^ФОП$/i.test(lf.short||'')) return 'fop'; return lf.person ? 'person' : 'company'; }
  if(/^\s*ФОП\s/i.test(cp.name||'')) return 'fop';
  const t=String(cp.tax_id||'').replace(/\D/g,'');
  if(t.length===10) return 'person'; if(t.length===8) return 'company';
  return cp.kind==='person' ? 'person' : 'company';
}

  return null;
}
function autoMapAll(placeholders, clauses, prev){

const mapComplete = m => !!m && (m.type!=='field'||!!m.field) && (m.type!=='clause'||!!m.code) && (m.type!=='category'||!!m.category) && !!MAP_TYPES[m.type];

}

}

  const owner = []; nodes.forEach((n,k)=>{ for(let j=0;j<n.text.length;j++) owner.push(k); });

  while((t = re.exec(full))){ const k0 = owner[t.index]; for(let j=t.index;j<t.index+t[0].length;j++) if(owner[j]!==k0){ owner[j]=k0; changed=true; } }
  if(!changed) return p;
  const texts = nodes.map(()=> '');
  for(let j=0;j<full.length;j++) texts[owner[j]] += full[j];
  let out = '', pos = 0;
  nodes.forEach((n,k)=>{ out += p.slice(pos, n.i); let open = n.open; const tx = texts[k];

function getTagRPr(p){

function inspectDocx(lib, buf){

  let doc; try { doc = new lib.Docxtemplater(zip, DT_OPTS); } catch(e){ return {errors:docxErrors(e), placeholders:[]}; }
  const seen = new Map();

function regQuery(st, me, opts){
  let q = sb.from('v_contracts').select('*', opts||{count:'exact'});
  const f = st.f||{};
  if(st.q && st.q.trim()) q = q.like('search_text', '%'+fold(st.q.trim())+'%');
  if(f.status && f.status.length) q = q.in('status', f.status);
  if(f.project_id) q = q.eq('project_id', f.project_id);
  if(f.donor) q = q.eq('project_donor', f.donor);
  if(f.type_id) q = q.eq('type_id', f.type_id);
  if(f.category) q = q.eq('cp_category', f.category);
  if(f.lawyer_id) q = f.lawyer_id==='none' ? q.is('lawyer_id', null) : q.eq('lawyer_id', f.lawyer_id);
  if(f.date_from) q = q.gte('contract_date', f.date_from);
  if(f.date_to) q = q.lte('contract_date', f.date_to);
  if(f.end_from) q = q.gte('end_date', f.end_from);
  if(f.end_to) q = q.lte('end_date', f.end_to);
  if(st.quick==='mine') q = q.eq('lawyer_id', me.id).not('status', 'in', '('+TERMINAL.join(',')+')');
  if(st.quick==='awaiting') q = q.in('status', ['in_vchasno','awaiting_signature']);
  if(st.quick==='ending') q = q.eq('status','active').eq('indefinite',false).gte('end_date', today()).lte('end_date', addDays(today(), st.days||30));
  if(st.quick==='overdue') q = q.eq('status','active').eq('indefinite',false).lt('end_date', today());
  const s = st.sort||{col:'created_at',dir:'desc'};
  q = q.order(s.col, {ascending: s.dir==='asc', nullsFirst:false});
  if(s.col!=='created_at') q = q.order('created_at', {ascending:false});
  return q;
}

function ColumnChooser({value, onChange}){
  const move = (k, dir) => { const a=[...value]; const i=a.indexOf(k), j=i+dir; if(i<0||j<0||j>=a.length) return; [a[i],a[j]]=[a[j],a[i]]; onChange(a); };
  const toggle = k => onChange(value.includes(k) ? value.filter(x=>x!==k) : [...value, k]);
  const ordered = [...value.map(k=>REG_COLS.find(c=>c.k===k)).filter(Boolean), ...REG_COLS.filter(c=>!value.includes(c.k))];
  return html`<div class="pop" style="min-width:280px">
    ${ordered.map(c=>{ const on=value.includes(c.k); return html`<div key=${c.k} class="it" style="justify-content:space-between">
      <label class="check" style="flex:1"><input type="checkbox" checked=${on} disabled=${on&&value.length<=2} onChange=${()=>toggle(c.k)}/> ${c.l}</label>
      ${on&&html`<span style="display:flex;gap:2px"><button class="btn ghost sm" onClick=${()=>move(c.k,-1)} title="Вище">↑</button><button class="btn ghost sm" onClick=${()=>move(c.k,1)} title="Нижче">↓</button></span>`}</div>`; })}
    <div class="it" style="justify-content:center;color:var(--accent)" onClick=${()=>onChange(REG_DEFAULT_COLS)}>Як за замовчуванням</div>
  </div>`;
}

    <select value=${r.amount_type||'fixed'} disabled=${disabled} onChange=${e=>set('amount_type',e.target.value)}>${AMOUNT.map(a=>html`<option value=${a.v}>${a.l}</option>`)}</select>
    <input inputmode="decimal" placeholder="Сума" value=${r.amount_type==='none'?'':(r.amount??'')} disabled=${disabled||r.amount_type==='none'} onInput=${e=>set('amount',e.target.value)}/>
    <select value=${r.currency_code||'UAH'} disabled=${disabled||r.amount_type==='none'} onChange=${e=>set('currency_code',e.target.value)}>${CURRENCIES.map(c=>html`<option value=${c}>${c}</option>`)}</select>
  </div>`;
}
function TermInputs({r, set, disabled}){
  return html`<div>
    <div style="display:flex;gap:8px;align-items:center"><input type="date" value=${r.start_date||''} disabled=${disabled} onInput=${e=>set('start_date',e.target.value)} title="Початок"/>
      <span class="muted">—</span><input type="date" value=${r.indefinite?'':(r.end_date||'')} disabled=${disabled||r.indefinite} onInput=${e=>set('end_date',e.target.value)} title="Завершення"/></div>
    <div style="margin-top:8px"><${Check} checked=${r.indefinite} disabled=${disabled} onChange=${v=>set('indefinite',v)}>Безстроковий (без нагадувань про строк)<//></div>
  </div>`;
}
function validateContract(r, isNew, cp){
  const e={};
  if(isNew){ if(!cp) e.cp='Оберіть контрагента'; else if(!cp.idx) e.cp='У контрагента немає індексу — оберіть йому категорію в картці контрагента'; if(!r.project_id) e.project='Оберіть проєкт'; }
  if(!r.type_id) e.type='Оберіть тип договору';
  if(!(r.title||'').trim()) e.title='Вкажіть предмет';
  if(r.amount_type!=='none' && r.amount!==''&&r.amount!=null && normNum(r.amount)==null) e.amount='Некоректна сума';
  if(!r.indefinite && r.start_date && r.end_date && r.end_date<r.start_date) e.end='Завершення раніше за початок';
  if(r.worksection_url && !/^https?:\/\//i.test(r.worksection_url.trim())) e.ws='Посилання має починатися з https://';
  return e;
}
function NewContract({cpId}){
  const {me, role, d} = useCtx();
  const [r,setR]=useState({amount_type:'fixed', currency_code:'UAH', contract_date:today(), start_date:today(), end_date:'', indefinite:false,
                           lawyer_id: ['lawyer','head_legal'].includes(role)?me.id:'', title:'', subject:''});
  const [cp,setCp]=useState(null); const [preview,setPreview]=useState(null); const [busy,setBusy]=useState(false);
  const [errs,setErrs]=useState({}); const [newCp,setNewCp]=useState(false); const [tried,setTried]=useState(false); const [genAfter,setGenAfter]=useState(true);
  const {tp, sj} = useLibLists();
  const set=(k,v)=>setR(p=>({...p,[k]:v}));
  useEffect(()=>{ if(cpId) sb.from('counterparties').select('id,name,idx,tax_id,category_id,legal_form_id').eq('id',cpId).maybeSingle().then(({data})=>data&&setCp(data)); },[cpId]);
  useEffect(()=>{ if(!cp||!r.project_id||!cp.idx){ setPreview(null); return; }
    sb.rpc('preview_contract_number',{p_counterparty:cp.id, p_project:r.project_id}).then(({data})=>setPreview(data||null)); },[cp&&cp.id, r.project_id]);
  useEffect(()=>{ if(tried) setErrs(validateContract(r, true, cp)); },[r, cp, tried]);
  if(!can(role,'legal')) return html`<${Empty} title="Створювати договори може юридичний офіс"/>`;
  const create=async()=>{ setTried(true); const e=validateContract(r, true, cp); setErrs(e); if(Object.keys(e).length) return;
    setBusy(true);
    const p={...r, counterparty_id:cp.id, amount: r.amount_type==='none'?null:normNum(r.amount), worksection_url:(r.worksection_url||'').trim(),
      template_id:r.template_id||null, subject_ref_id:r.subject_ref_id||null};
    const {data,error}=await sb.rpc('create_contract',{p}); setBusy(false);
    if(error) return toastErr(error);
    pushToast('Чернетку створено','ok'); go('contracts/'+data+(r.template_id&&genAfter?'?tab=document&gen=1':''));
  };
  const kind = cp ? cpKind(cp, d.formsBy[cp.legal_form_id]) : null;
  const lawyers=d.users.filter(u=>['admin','head_legal','lawyer'].includes(u.role)&&u.active!==false);
  return html`
    <div class="head"><div><h1>Новий договір</h1><p>Картку створює юридичний офіс</p></div><div class="acts"><button class="btn" onClick=${()=>history.back()}>Скасувати</button></div></div>
    <div class="grid-main">
      <div class="card pad">
        <h3 style="margin-bottom:18px">Основні параметри</h3>
        <${FRow} label="Контрагент" req error=${errs.cp}><${AsyncSelect} value=${cp?cp.id:''} label=${cp?cp.name+(cp.idx?' • '+cp.idx:' • без індексу'):''} search=${searchCounterparties} onChange=${(v,o)=>setCp(o?o.c:null)}
          footer=${html`<div class="ss-opt" style="color:var(--accent);font-weight:600" onClick=${()=>setNewCp(true)}>+ Новий контрагент</div>`}/><//>
        <${FRow} label="Проєкт" req error=${errs.project}><${SearchSelect} value=${r.project_id||''} options=${d.projects.filter(p=>p.active).map(p=>({v:p.id,l:projectLabel(p),sub:p.donor||''}))} onChange=${v=>set('project_id',v)}/><//>
        <${FRow} label="Тип договору" req error=${errs.type}><${SearchSelect} value=${r.type_id||''} options=${d.types.filter(t=>t.active).map(t=>({v:t.id,l:t.name}))} onChange=${v=>set('type_id',v)}/><//>
        <${FRow} label="Шаблон" hint=${r.template_id?'':'Можна обрати й пізніше — на вкладці «Документ»'}><${SearchSelect} value=${r.template_id||''} options=${tplOptions(tp, r, kind, d)} onChange=${v=>set('template_id',v)} placeholder="— без шаблону —"/>
          ${r.template_id&&html`<div style="margin-top:6px"><${Check} checked=${genAfter} onChange=${setGenAfter}>Одразу сформувати документ після створення<//></div>`}<//>
        <${FRow} label="Предмет з бібліотеки" hint="Текст копіюється в договір — правки тут не змінюють бібліотеку"><${SubjectPick} r=${r} setR=${setR} sj=${sj} kind=${kind}/><//>
        <${FRow} label="Предмет" req error=${errs.title}><input value=${r.title} placeholder="Коротко, наприклад: Організаційний супровід освітніх активностей" onInput=${e=>set('title',e.target.value)}/><//>
        <${FRow} label="Повний текст предмета"><textarea rows=${r.subject&&r.subject.length>200?6:3} value=${r.subject} onInput=${e=>set('subject',e.target.value)}></textarea><//>
        <${FRow} label="Сума" error=${errs.amount}><${AmountInputs} r=${r} set=${set}/><//>
        <${FRow} label="Дата договору"><input type="date" value=${r.contract_date||''} onInput=${e=>set('contract_date',e.target.value)}/><//>
        <${FRow} label="Строк" error=${errs.end}><${TermInputs} r=${r} set=${set}/><//>
        <${FRow} label="Юрист"><${SearchSelect} value=${r.lawyer_id||''} options=${lawyers.map(u=>({v:u.id,l:userLabel(u)}))} onChange=${v=>set('lawyer_id',v)} placeholder="Не призначено"/><//>
        <${FRow} label="Worksection" error=${errs.ws} hint="Посилання на задачу"><input value=${r.worksection_url||''} placeholder="https://…/task/12874" onInput=${e=>set('worksection_url',e.target.value)}/><//>
        <${FRow} label="Примітка"><input value=${r.note||''} onInput=${e=>set('note',e.target.value)}/><//>
      </div>
      <div class="card pad">
        <h3>Номер</h3>
        <p class="small">Буде присвоєно:</p>
        ${preview?html`<div class="big-num">${preview}</div>`:html`<p style="margin:10px 0 14px">${cp&&!cp.idx?'У контрагента немає індексу — оберіть йому категорію.':'Оберіть контрагента і проєкт — система запропонує наступний номер.'}</p>`}
        <p class="small" style="margin-bottom:16px">Після присвоєння номер блокується. Змінити його можна лише технічною зміною з причиною.</p>
        <button class="btn primary" style="width:100%;justify-content:center" onClick=${create} disabled=${busy}>${busy?html`<${Spinner}/>`:'Створити чернетку'}</button>
      </div>
    </div>
    ${newCp&&html`<${CounterpartyForm} row=${{active:true}} onClose=${()=>setNewCp(false)} onSaved=${c=>{ setNewCp(false); setCp(c); }}/>`}`;
}

function ContractPage({id, tab, gen}){
  const {me, role, d} = useCtx();
  const [c,setC]=useState(null); const [dlg,setDlg]=useState(null); const [editing,setEditing]=useState(false); const [files,setFiles]=useState(null);
  const load=async()=>{ const {data,error}=await sb.from('v_contracts').select('*').eq('id',id).maybeSingle(); if(error) toastErr(error); setC(data||false); };
  const loadFiles=async()=>{ const {data,error}=await sb.from('contract_files').select('*').eq('contract_id',id).order('uploaded_at'); if(error) toastErr(error); setFiles(data||[]); };
  useEffect(()=>{ load(); loadFiles(); },[id]);
  if(c===null) return html`<${Loading}/>`;
  if(c===false) return html`<${Empty} title="Договір не знайдено або немає доступу"><a href="#/contracts">До реєстру</a><//>`;
  const legal=can(role,'legal');
  const setTab=t=>{ setEditing(false); setQuery({tab:t}); };
  const toggleExt=async()=>{ const {error}=await sb.from('contracts').update({needs_extension:!c.needs_extension}).eq('id',c.id); if(error) return toastErr(error); pushToast(c.needs_extension?'Позначку знято':'Позначено: потребує продовження','ok'); load(); };
  const del=async()=>{ if(!confirm('Видалити договір '+(c.number||'')+' остаточно? Номер не повернеться в нумерацію.')) return;
    const {error}=await sb.from('contracts').delete().eq('id',c.id); if(error) return toastErr(error); pushToast('Договір видалено','ok'); go('contracts'); };
  const done=()=>{ setDlg(null); load(); };
  return html`
    <div class="head">
      <div style="min-width:0"><div class="small" style="margin-bottom:4px"><a href="#/contracts">← Реєстр</a></div>
        <h1 style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">${c.number||'Без номера'} <${StatusChip} s=${c.status}/>${c.needs_extension&&html`<${Chip} c="amber">Потребує продовження<//>`}</h1>
        <p>${c.cp_name||'—'}${c.type_name?' • '+c.type_name:''}</p></div>
      <div class="acts">
        ${legal&&html`<button class="btn primary" onClick=${()=>setDlg('status')}>Змінити статус</button>`}
        ${legal&&!editing&&tab==='overview'&&html`<button class="btn" onClick=${()=>setEditing(true)}>Редагувати</button>`}
        ${role==='chief_accountant'&&html`<button class="btn" onClick=${()=>setDlg('finance')}>Змінити суму</button>`}
        <${Dropdown} label="⋯" items=${[
          {l:c.needs_extension?'Зняти позначку «Потребує продовження»':'Позначити «Потребує продовження»', on:toggleExt, hidden:!legal},
          {l:'Технічна зміна номера', on:()=>setDlg('number'), hidden:!can(role,'head')},
          {l:'Видалити договір', on:del, danger:true, hidden:role!=='admin'},
        ]}/>
      </div>
    </div>
    <${Tabs} value=${tab} onChange=${setTab} items=${[['overview','Огляд'],['document','Документ'],['versions','Версії'],['amendments','Додаткові угоди'],['vchasno','Вчасно'],['history','Історія']]}/>
    ${tab==='overview'&&(editing
      ? html`<${ContractEditForm} c=${c} onCancel=${()=>setEditing(false)} onSaved=${()=>{ setEditing(false); load(); }}/>`
      : html`<${ContractOverview} c=${c} files=${files} onTab=${setTab}/>`)}
    ${tab==='document'&&html`<${ContractDocument} c=${c} files=${files} reloadFiles=${loadFiles} reload=${load} gen=${!!gen}/>`}
    ${tab==='versions'&&html`<${ContractVersions} c=${c}/>`}
    ${tab==='amendments'&&html`<div class="card pad"><p>Додаткові угоди до договору з’являться на етапі 5.</p></div>`}
    ${tab==='vchasno'&&html`<div class="card pad"><p>Передача у Вчасно, статуси й підписані файли з’являться на етапі 4.</p></div>`}
    ${tab==='history'&&html`<div class="card pad"><${EntityHistory} entity="contracts" id=${c.id} withFiles=${true}/></div>`}
    ${dlg==='status'&&html`<${StatusDialog} c=${c} onClose=${()=>setDlg(null)} onDone=${done}/>`}
    ${dlg==='number'&&html`<${NumberDialog} c=${c} onClose=${()=>setDlg(null)} onDone=${done}/>`}
    ${dlg==='finance'&&html`<${FinanceDialog} c=${c} onClose=${()=>setDlg(null)} onDone=${done}/>`}`;
}

        ${c.note&&html`<div class="k">Примітка</div><div class="v">${c.note}</div>`}

    </div>
    <div class="stack">

        <div style="margin-bottom:10px"><span class=${'chip '+((stMap[c.status]||{}).c||'gray')}>${(stMap[c.status]||{}).full||(stMap[c.status]||{}).l||c.status}</span></div>
        <p class="small">Вчасно: ще не підключено (етап 4)</p>

/* ---------------- Файли договору ---------------- */
function FilesPanel({contractId, files, reload, editable, title}){
  const [up,setUp]=useState(false);
  const onFile=async e=>{ const list=[...e.target.files]; e.target.value=''; if(!list.length) return;
    setUp(true); let ok=0; const errs=[];
    for(let i=0;i<list.length;i++){ const file=list[i];
      const path=`${contractId}/${Date.now()+i}_${safeName(file.name)}`;   // у шляху лише латиниця; оригінальна назва — у file_name
      const {error}=await sb.storage.from('contracts').upload(path,file,{upsert:false});
      if(error){ errs.push(file.name+': '+errText(error)); continue; }
      const {error:ie}=await sb.from('contract_files').insert({contract_id:contractId,file_path:path,file_name:file.name,size:file.size});
      if(ie){ await sb.storage.from('contracts').remove([path]); errs.push(file.name+': '+errText(ie)); continue; }
      ok++;
    }
    setUp(false);
    if(errs.length) pushToast((ok?'Додано: '+ok+'. ':'')+'Не завантажено — '+errs.join('; '),'err'); else pushToast(ok===1?'Файл додано':'Додано файлів: '+ok,'ok');
    reload();
  };
  const openFile=async f=>{ const w=window.open('','_blank');   // вікно відкриваємо одразу: Safari блокує вікна, відкриті після await
    const {data,error}=await sb.storage.from('contracts').createSignedUrl(f.file_path,3600);
    if(error||!data?.signedUrl){ if(w) w.close(); return pushToast('Файл: '+(error?errText(error):'не вдалося відкрити'),'err'); }
    if(w) w.location.href=data.signedUrl; else pushToast('Браузер заблокував нове вікно — дозвольте спливаючі вікна для цього сайту','err'); };
  const dlFile=async f=>{ const {data,error}=await sb.storage.from('contracts').download(f.file_path); if(error) return pushToast('Файл: '+errText(error),'err'); downloadBlob(data, f.file_name||'file'); };
  const delFile=async f=>{ if(!confirm('Видалити файл «'+f.file_name+'»?')) return;
    const {error}=await sb.storage.from('contracts').remove([f.file_path]); if(error) return pushToast('Файл: '+errText(error),'err');
    const {error:de}=await sb.from('contract_files').delete().eq('id',f.id); if(de) return toastErr(de);
    pushToast('Файл видалено','ok'); reload(); };
  return html`<div>
    <div class="ctitle"><h3 style="margin:0">${title||'Файли договору'}</h3>
      ${editable&&html`<label class="btn sm">${up?html`<${Spinner} dark=${true}/>`:'+ Додати файли'}<input type="file" multiple onChange=${onFile} disabled=${up} style="display:none"/></label>`}</div>
    ${files===null?html`<${Loading}/>`:files.length===0?html`<p>Файлів ще немає.</p>`:html`<table><tbody>
      ${files.map(f=>html`<tr key=${f.id}><td><a href="javascript:void 0" title="Відкрити" onClick=${()=>openFile(f)}>📄 ${f.file_name}</a></td><td class="num muted nw">${fmtSize(f.size)}</td>
        <td class="nw" style="text-align:right">${fmtTs(f.uploaded_at)} <button class="btn ghost sm" title="Завантажити з оригінальною назвою" onClick=${()=>dlFile(f)}>⬇</button>${editable&&html`<button class="btn ghost sm" title="Видалити" onClick=${()=>delFile(f)} style="color:var(--red)">✕</button>`}</td></tr>`)}
    </tbody></table>`}
  </div>`;
}

  'placeholders','tested_by','activated_by','mime','missing_fields'];
function useRefNames(entries){
  const {d} = useCtx(); const [cps,setCps]=useState({});
  useEffect(()=>{ const want={counterparty_id:new Set(), template_id:new Set(), subject_ref_id:new Set(), final_version_id:new Set()};
    (entries||[]).forEach(e=>['old_data','new_data'].forEach(k=>{ const o=e[k]||{}; Object.keys(want).forEach(f=>{ if(o[f]&&!cps[o[f]]) want[f].add(o[f]); }); }));
    const put=list=>list&&setCps(p=>({...p, ...Object.fromEntries(list)}));
    if(want.counterparty_id.size) sb.from('counterparties').select('id,name,idx').in('id',[...want.counterparty_id]).then(({data})=>put(data&&data.map(x=>[x.id, x.name+(x.idx?' ('+x.idx+')':'')])));
    if(want.template_id.size) sb.from('templates').select('id,name').in('id',[...want.template_id]).then(({data})=>put(data&&data.map(x=>[x.id, x.name])));
    if(want.subject_ref_id.size) sb.from('subjects').select('id,code,name,version_no').in('id',[...want.subject_ref_id]).then(({data})=>put(data&&data.map(x=>[x.id, x.name+' ('+x.code+' v'+x.version_no+')'])));
    if(want.final_version_id.size) sb.from('contract_versions').select('id,version_no').in('id',[...want.final_version_id]).then(({data})=>put(data&&data.map(x=>[x.id, 'v'+x.version_no])));
  },[entries]);
  return (k, v, ent) => {
    if(v==null || v==='') return '—';
    if(k==='status' && ['template_versions','clauses','subjects'].includes(ent)) return (TPL_VST[v]||{}).l||v;
    switch(k){
      case 'counterparty_id': case 'template_id': case 'subject_ref_id': case 'final_version_id': return cps[v]||'…';
      case 'contract_type_id': return (d.typesBy[v]||{}).name||'—';
      case 'doc_type_id': return (d.docTypes.find(x=>x.id===v)||{}).name||'—';
      case 'cp_kind': return CP_KINDS[v]||v;
      case 'category': return ent==='clauses' ? (CLAUSE_CATS[v]||v) : v;
      case 'kind': return ent==='contract_versions' ? (VER_KIND[v]||v) : v;
      case 'project_id': return projectLabel(d.projectsBy[v])||'—';
      case 'type_id': return (d.typesBy[v]||{}).name||'—';
      case 'lawyer_id': return userLabel(d.usersBy[v])||'—';
      case 'category_id': { const x=d.categoriesBy[v]; return x?x.prefix+' — '+x.name:'—'; }
      case 'legal_form_id': return (d.formsBy[v]||{}).short||'—';
      case 'status': return (stMap[v]||{}).l||v;
      case 'amount_type': return amMap[v]||v;
      case 'role': return roleL[v]||v;
      case 'amount': return fmtMoney(v);
    }
    if(typeof v==='boolean') return v?'так':'ні';
    if(typeof v==='object') return k==='mapping' ? Object.keys(v).length+' '+plural(Object.keys(v).length,'поле','поля','полів') : JSON.stringify(v).slice(0,160);
    if(/(_date|^deadline|^effective_(from|to))$/.test(k) && typeof v==='string') return fmtDate(v);
    if(/_at$/.test(k)) return fmtDT(v);
    return String(v);
  };
}
function histSummary(e){
  const o=e.old_data||{}, n=e.new_data||{}, ch=e.changed||[];
  if(e.entity==='contract_files') return e.action==='insert'?'Додано файл «'+n.file_name+'»':e.action==='delete'?'Видалено файл «'+o.file_name+'»':'Змінено файл';
  if(e.entity==='contract_versions') return e.action==='insert'?'Додано версію документа v'+n.version_no+' ('+(VER_KIND[n.kind]||n.kind)+')':'Змінено версію документа';
  if(e.entity==='org_settings') return 'Змінено реквізити Фонду';
  if(e.entity==='template_versions'){
    if(e.action==='insert') return 'Створено версію шаблону v'+n.version_no; if(e.action==='delete') return 'Видалено чернетку шаблону v'+o.version_no;
    if(ch.includes('status')) return n.status==='active'?'Опубліковано версію шаблону':'Версію шаблону архівовано';
    if(ch.includes('tested_at')&&n.tested_at&&ch.length<=2) return 'Тест шаблону пройдено';
    if(ch.includes('file_path')) return 'Замінено файл шаблону'; return 'Змінено версію шаблону'; }
  if(e.entity==='clauses'||e.entity==='subjects'){ const w=e.entity==='clauses'?'положення':'предмет';
    if(e.action==='insert') return 'Створено '+w+' '+n.code+' v'+n.version_no; if(e.action==='delete') return 'Видалено чернетку: '+w+' '+o.code;
    if(ch.includes('status')) return n.status==='active'?'Опубліковано: '+w:'Знято з використання: '+w; return 'Змінено '+w; }
  if(e.action==='insert') return e.entity==='contracts'?'Створено договір':e.entity==='counterparties'?'Створено контрагента'+(n.idx?' '+n.idx:''):'Створено: '+(ENTITY_L[e.entity]||e.entity).toLowerCase();
  if(e.action==='delete') return 'Видалено: '+(ENTITY_L[e.entity]||e.entity).toLowerCase();
  if((e.changed||[]).includes('number') && !o.number && n.number) return 'Присвоєно номер '+n.number;
  if((e.changed||[]).includes('number')) return 'Технічна зміна номера';
  if((e.changed||[]).length===1 && e.changed[0]==='status') return 'Змінено статус';
  return 'Змінено';
}
function HistoryItems({entries, showEntity}){
  const fv = useRefNames(entries);
  if(!entries.length) return html`<p>Змін ще немає.</p>`;
  return html`<div class="hist">${entries.map(e=>{
    const keys=(e.action==='update'?(e.changed||[]):[]).filter(k=>!HIDE_F.includes(k)&&!(k==='number'&&!(e.old_data||{}).number)&&k!=='number_assigned_at'&&k!=='seq_no');
    const ent = showEntity ? (e.entity==='contracts'?html` · <a href=${'#/contracts/'+e.entity_id}>договір</a>`:e.entity==='counterparties'?html` · <a href=${'#/counterparties/'+e.entity_id}>контрагент</a>`
      :(e.entity==='contract_files'||e.entity==='contract_versions')&&e.parent_id?html` · <a href=${'#/contracts/'+e.parent_id}>договір</a>`
      :e.entity==='templates'&&e.entity_id?html` · <a href=${'#/templates/'+e.entity_id}>шаблон</a>`:e.entity==='template_versions'&&e.parent_id?html` · <a href=${'#/templates/'+e.parent_id}>шаблон</a>`
      :' · '+(ENTITY_L[e.entity]||e.entity)) : '';
    return html`<div class="it" key=${e.id}>
      <div><b>${histSummary(e)}</b>${ent}</div>
      <div class="small muted">${fmtDT(e.at)} · ${e.actor_email||'система'}</div>
      ${keys.length>0&&html`<div class="ch">${keys.flatMap(k=>{ const ov=(e.old_data||{})[k], nv=(e.new_data||{})[k];
        if(k==='data' && ov && nv && typeof ov==='object' && typeof nv==='object') return [...new Set([...Object.keys(ov),...Object.keys(nv)])].filter(x=>JSON.stringify(ov[x])!==JSON.stringify(nv[x]))
          .map(x=>html`<div key=${x}>${ORG_L[x]||x}: <span class="muted">${ov[x]||'—'}</span> → <b>${nv[x]||'—'}</b></div>`);
        return [html`<div key=${k}>${FIELD_L[k]||k}: <span class="muted">${fv(k,ov,e.entity)}</span> → <b>${fv(k,nv,e.entity)}</b></div>`]; })}</div>`}
      ${e.reason&&html`<div class="ch">Причина: «${e.reason}»</div>`}
    </div>`; })}</div>`;
}
function EntityHistory({entity, id, withFiles}){
  const [rows,setRows]=useState(null);
  useEffect(()=>{ let q=sb.from('audit_log').select('*').order('at',{ascending:false}).limit(300);
    q = withFiles ? q.or(`and(entity.eq.${entity},entity_id.eq.${id}),parent_id.eq.${id}`) : q.eq('entity',entity).eq('entity_id',id);
    q.then(({data,error})=>{ if(error){ toastErr(error); setRows([]); } else setRows(data); }); },[entity,id]);
  if(rows===null) return html`<${Loading}/>`;
  return html`<${HistoryItems} entries=${rows}/>`;
}

/* ---------------- Шаблони ---------------- */
const TPL_VST = {draft:{l:'Чернетка', c:'amber'}, active:{l:'Активна', c:'green'}, archived:{l:'Архівна', c:'gray'}};
const tplFileCache = new Map();
async function loadStorageBytes(bucket, path){
  const key = bucket+':'+path; if(tplFileCache.has(key)) return tplFileCache.get(key);
  const {data, error} = await sb.storage.from(bucket).download(path); if(error) throw error;
  const bytes = new Uint8Array(await data.arrayBuffer()); tplFileCache.set(key, bytes); return bytes;
}
const loadTemplateFile = path => loadStorageBytes('templates', path);
async function loadClausesAll(){ const {data,error}=await sb.from('clauses').select('*').order('code').order('version_no'); if(error) throw error; return data||[]; }
function tplState(t){
  const vs = t.template_versions||[], act = vs.find(v=>v.status==='active'), dr = vs.find(v=>v.status==='draft');
  if(t.archived) return {k:'archived', l:'Архівний', c:'gray', act, dr};
  if(act) return {k:'active', l:'Активний', c:'green', act, dr};
  if(dr) return {k:'draft', l:'Чернетка', c:'amber', act, dr};
  return {k:'inactive', l:'Без активної версії', c:'gray', act, dr};
}
const tagLabel = (tag, mapping) => { const m=(mapping||{})[tag]||autoMapTag(tag,[]); if(!m) return tag;
  if(m.type==='field') return (TPL_FIELD[m.field]||{}).l||tag; if(m.type==='clause') return 'Положення '+m.code; if(m.type==='category') return 'Положення: '+(CLAUSE_CATS[m.category]||m.category); return tag; };
const tagWhere = (tag, mapping) => { const m=(mapping||{})[tag]||autoMapTag(tag,[]); const f=m&&m.type==='field'&&TPL_FIELD[m.field];
  if(!f) return m&&m.type==='clause'?'Бібліотеки → Положення':''; return ['картка договору','картка договору','картка контрагента','Налаштування → Реквізити Фонду','картка договору / проєкт'][f.g]; };
function tagClassify(mapping){
  return (prefix, name) => {
    if(prefix==='/'||prefix==='#'||prefix==='^'){ const fl=TPL_FLAGS.find(f=>f.k===name);
      return {cls: fl||(mapping||{})[name] ? 's' : 'x', title: prefix==='/' ? 'кінець умовного блоку' : 'умова: '+(fl?fl.l:name)+(prefix==='^'?' (НЕ)':'')}; }
    const m=(mapping||{})[name]; if(!m) return {cls:'x', title:'Не зіставлено'};
    if(m.type==='clause'||m.type==='category') return {cls:'c', title:tagLabel(name,mapping)};
    return {cls:'f', title:m.type==='field'?tagLabel(name,mapping):MAP_TYPES[m.type]};
  };
}

function MappingPanel({v, clauses, editable, onSave}){
  const [m,setM]=useState(()=>({...(v.mapping||{})})); const [busy,setBusy]=useState(false);
  const dirty=JSON.stringify(m)!==JSON.stringify(v.mapping||{});
  const seen=new Set(), tags=[], conds=[];
  (v.placeholders||[]).forEach(p=>{ if(p.prefix==='/') return; const k=p.prefix+p.name; if(seen.has(k)) return; seen.add(k);
    if((p.prefix==='#'||p.prefix==='^') && TPL_FLAG_SET.has(p.name)) conds.push(p); else tags.push(p); });
  const codes=[...new Map(clauses.map(c=>[c.code,c])).values()];
  const setT=(name, val)=>setM(p=>{ const n={...p}; if(val) n[name]=val; else delete n[name]; return n; });
  const fieldOpts=TPL_FIELDS.map(f=>({v:f.k, l:f.l, sub:'{{'+f.k+'}} • '+TPL_GROUPS[f.g]}));
  const save=async()=>{ setBusy(true); await onSave(cleanMapping(m)); setBusy(false); };
  if(!tags.length&&!conds.length) return html`<p class="small">У файлі немає полів {{…}}.</p>`;
  return html`<div>
    ${tags.map(p=>{ const cur=m[p.name]; const bad=!mapComplete(cur);
      return html`<div key=${p.prefix+p.name} class=${'mrow'+(bad?' bad':'')}>
        <div class="mtag"><span class=${'ph '+(bad?'x':cur.type==='clause'||cur.type==='category'?'c':'f')}>{{${p.prefix}${p.name}}}</span></div>
        ${editable?html`<div class="mctl">
          <select value=${cur?cur.type:''} onChange=${e=>{ const ty=e.target.value; setT(p.name, !ty?null:ty==='field'?{type:'field', field:(autoMapTag(p.name,[])||{}).field||''}:ty==='category'?{type:'category', category:'other'}:ty==='clause'?{type:'clause', code:''}:ty==='text'?{type:'text', text:''}:{type:'empty'}); }}>
            <option value="">— не зіставлено —</option>${Object.entries(MAP_TYPES).map(([k,l])=>html`<option value=${k}>${l}</option>`)}</select>
          ${cur&&cur.type==='field'&&html`<${SearchSelect} value=${cur.field} options=${fieldOpts} onChange=${x=>setT(p.name,{type:'field', field:x})} allowClear=${false}/>`}
          ${cur&&cur.type==='category'&&html`<select value=${cur.category} onChange=${e=>setT(p.name,{type:'category', category:e.target.value})}>${Object.entries(CLAUSE_CATS).map(([k,l])=>html`<option value=${k}>${l}</option>`)}</select>`}
          ${cur&&cur.type==='clause'&&html`<${SearchSelect} value=${cur.code} options=${codes.map(c=>({v:c.code, l:c.code, sub:c.name}))} onChange=${x=>setT(p.name,{type:'clause', code:x})} allowClear=${false} placeholder="— код положення —"/>`}
          ${cur&&cur.type==='text'&&html`<textarea rows="2" value=${cur.text||''} onInput=${e=>setT(p.name,{type:'text', text:e.target.value})}></textarea>`}
        </div>`:html`<div class="small">${cur?(cur.type==='field'?tagLabel(p.name,m):cur.type==='text'?'Текст: «'+(cur.text||'').slice(0,60)+'»':cur.type==='empty'?'Порожньо':tagLabel(p.name,m)):html`<span style="color:var(--red-t)">не зіставлено</span>`}</div>`}
      </div>`; })}
    ${conds.length>0&&html`<div class="small muted" style="margin:12px 0 6px;font-weight:700">Умовні блоки</div>${conds.map(p=>html`<div key=${p.prefix+p.name} class="mrow"><div class="mtag"><span class="ph s">{{${p.prefix}${p.name}}}</span></div><div class="small">${p.prefix==='^'?'якщо НЕ: ':'якщо: '}${TPL_FLAGS.find(f=>f.k===p.name).l}</div></div>`)}`}
    ${editable&&html`<div style="display:flex;gap:8px;align-items:center;margin-top:12px"><button class="btn primary sm" onClick=${save} disabled=${!dirty||busy}>Зберегти зіставлення</button>${dirty&&html`<span class="small muted">після збереження тест потрібно пройти знову</span>`}</div>`}
  </div>`;
}

const searchContracts = async q => {
  let x=sb.from('v_contracts').select('id,number,title,cp_name').order('created_at',{ascending:false}).limit(20);
  if(q&&q.trim()) x=x.like('search_text','%'+fold(q.trim())+'%');
  const {data,error}=await x; if(error) throw error;
  return (data||[]).map(c=>({v:c.id, l:(c.number||'без номера')+' — '+(c.cp_name||''), sub:c.title}));
};
async function loadDocData(c, d){
  const [cpR, orgR, clR, sjR] = await Promise.all([
    c.counterparty_id ? sb.from('counterparties').select('*').eq('id',c.counterparty_id).maybeSingle() : Promise.resolve({data:null}),
    sb.from('org_settings').select('data').eq('id',1).maybeSingle(),
    sb.from('clauses').select('*').eq('status','active'),
    c.subject_ref_id ? sb.from('subjects').select('*').eq('id',c.subject_ref_id).maybeSingle() : Promise.resolve({data:null})]);
  const err=[cpR,orgR,clR,sjR].find(x=>x.error); if(err) throw err.error;
  const cp=cpR.data||{};
  return docContext({contract:c, cp, lf:d.formsBy[cp.legal_form_id]||null, project:d.projectsBy[c.project_id]||{}, org:(orgR.data&&orgR.data.data)||{},
    subj:sjR.data, clauses:clR.data||[], typeName:(d.typesBy[c.type_id]||{}).name||c.type_name||'', lawyerName:c.lawyer_name||''});
}
function MissingNote({missing, mapping}){
  if(!missing||!missing.length) return html`<div class="note" style="margin-bottom:12px">✓ Усі поля заповнено даними.</div>`;
  const groups={}; missing.forEach(tg=>{ const w=tagWhere(tg,mapping)||'шаблон (незіставлені поля)'; (groups[w]=groups[w]||[]).push(tagLabel(tg,mapping)); });
  return html`<div class="note amber" style="margin-bottom:12px"><b>Без даних — у документі буде порожньо:</b>
    ${Object.entries(groups).map(([w,l])=>html`<div key=${w} style="margin-top:4px">${l.join(', ')} <span style="opacity:.8">— заповніть: ${w}</span></div>`)}</div>`;
}

function TemplateTestModal({t, v, bytes, clauses, onClose, onTested}){
  const {d, role} = useCtx();
  const [src,setSrc]=useState('sample'); const [cid,setCid]=useState(''); const [clabel,setClabel]=useState('');
  const [res,setRes]=useState(null); const [busy,setBusy]=useState(false); const [err,setErr]=useState([]);
  const run=async(which, id)=>{ setBusy(true); setErr([]); setRes(null);
    try{ const lib=await loadDocgen(); let ctx;
      if(which==='contract'){ const {data:c,error}=await sb.from('v_contracts').select('*').eq('id',id).single(); if(error) throw error; ctx=await loadDocData(c, d); }
      else ctx=sampleContext({org:d.org, clauses:clauses.filter(c=>c.status==='active'), kind:t.cp_kind, project:d.projectsBy[t.project_id], typeId:t.contract_type_id, typeName:(d.typesBy[t.contract_type_id]||{}).name});
      setRes(renderDocx(lib, bytes, v.mapping, ctx));
    } catch(e){ setErr(e&&e.properties ? docxErrors(e) : [errText(e)]); }
    setBusy(false); };
  useEffect(()=>{ run('sample'); },[]);
  const mark=async()=>{ setBusy(true); const {error}=await sb.rpc('mark_template_tested',{p_version:v.id}); setBusy(false);
    if(error) return toastErr(error); pushToast('Тест зафіксовано — версію можна публікувати','ok'); onTested(); };
  const fname=(t.name+' — тест v'+v.version_no).replace(/[\\\/:*?"<>|]+/g,'-')+'.docx';
  return html`<${Modal} xwide=${true} title=${'Тест шаблону • v'+v.version_no} sub=${t.name} onClose=${onClose}
    foot=${html`${res&&html`<button class="btn" style="margin-right:auto" onClick=${()=>downloadBlob(new Blob([res.out],{type:DOCX_MIME}), fname)}>Завантажити DOCX</button>`}
      <button class="btn" onClick=${onClose}>Закрити</button>
      ${can(role,'legal')&&v.status==='draft'&&html`<button class="btn primary" onClick=${mark} disabled=${busy||!res}>${v.tested_at?'Підтвердити тест ще раз':'Документ правильний — позначити як перевірений'}</button>`}`}>
    <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:14px">
      <span class=${'fchip'+(src==='sample'?' on':'')} onClick=${()=>{ setSrc('sample'); run('sample'); }}>Тестові дані</span>
      <span class=${'fchip'+(src==='contract'?' on':'')} onClick=${()=>setSrc('contract')}>Дані договору</span>
      ${src==='contract'&&html`<div style="width:380px"><${AsyncSelect} value=${cid} label=${clabel} search=${searchContracts} onChange=${(x,o)=>{ setCid(x); setClabel(o?o.l:''); if(x) run('contract', x); }} placeholder="Оберіть договір"/></div>`}
      ${busy&&html`<${Spinner} dark=${true}/>`}
    </div>
    ${err.length>0&&html`<div class="note red" style="margin-bottom:12px"><b>Документ не сформовано:</b><ul style="margin:6px 0 0;padding-left:18px">${err.map(e=>html`<li>${e}</li>`)}</ul></div>`}
    ${res&&html`<${MissingNote} missing=${res.missing} mapping=${v.mapping}/><${DocxView} bytes=${res.out} height="62vh"/>`}
  <//>`;
}

{{^is_fop}}Текст для всіх, крім ФОП{{/is_fop}}</div>

    <div class="b" style="margin:12px 0 6px">Поради</div>
    <ul class="small" style="margin:0;padding-left:18px;color:var(--muted);line-height:1.6">
      <li>Поле, що стоїть окремим абзацом ({{subject}}, {{contractor_details}}, положення), розгортається в кілька абзаців з тим самим форматуванням; якщо даних немає — абзац зникає.</li>
      <li>Форматуйте тег цілком: значення отримає шрифт і накреслення першого символу тегу.</li>

  <//>`;

const DOC_EDITABLE = ['draft','processing','in_approval'];
const VER_KIND_C = {generated:'indigo', lawyer_edit:'teal', negotiation:'amber', final:'green'};
const VER_MAX = 15*1024*1024;
async function loadContractVersions(cid){
  const {data,error}=await sb.from('contract_versions').select('*, template_versions(version_no, template_id, templates(name, doc_type_id))').eq('contract_id',cid).order('version_no',{ascending:false});
  if(error) throw error; return data||[];

function verFileName(c, v, d){
  const tv=v.template_versions, dt=tv&&tv.templates&&d.docTypes.find(x=>x.id===tv.templates.doc_type_id);
  return versionFileName(c, v, {final:v.id===c.final_version_id, docShort:dt?dt.short:'Договір', cpLatin:c.cp_name_latin, cpName:c.cp_name, projectCode:c.project_code});
}
const verMime = v => v.mime || (fileExt(v.file_name)==='pdf'?'application/pdf':DOCX_MIME);
async function downloadVersion(c, v, d){
  try{ const b=await loadStorageBytes('contracts', v.file_path); downloadBlob(new Blob([b],{type:verMime(v)}), verFileName(c,v,d)); }
  catch(e){ pushToast('Файл: '+errText(e),'err'); }
}
const verSource = v => v.template_versions ? 'Шаблон «'+((v.template_versions.templates||{}).name||'—')+'» v'+v.template_versions.version_no : v.kind==='generated' ? 'Шаблон' : 'Завантажено вручну';

function PdfView({bytes, height}){
  const [url,setUrl]=useState('');
  useEffect(()=>{ if(!bytes) return; const u=URL.createObjectURL(new Blob([bytes],{type:'application/pdf'})); setUrl(u); return ()=>URL.revokeObjectURL(u); },[bytes]);
  return url ? html`<iframe src=${url} style=${'width:100%;border:0;border-radius:10px;height:'+(height||'70vh')} title="PDF"></iframe>` : html`<${Loading}/>`;
}
function VersionPreview({v, height}){
  const [b,setB]=useState(null); const [err,setErr]=useState('');
  useEffect(()=>{ let dead=false; setB(null); setErr(''); loadStorageBytes('contracts', v.file_path).then(x=>{ if(!dead) setB(x); }).catch(e=>{ if(!dead) setErr(errText(e)); }); return ()=>{ dead=true; }; },[v.id]);
  if(err) return html`<div class="note red">Файл: ${err}</div>`;
  const ext=fileExt(v.file_name);

  return html`<${DocxView} bytes=${b} height=${height||'70vh'} empty="Завантаження…"/>`;
}

async function saveContractVersion(c, {blob, fileName, kind, tv, comment, missing}){
  const path=`${c.id}/${Date.now()}_${kind}_${safeName(fileName)}`;
  const {error:ue}=await sb.storage.from('contracts').upload(path, blob, {contentType:blob.type||undefined, upsert:false}); if(ue) throw ue;
  const {data, error}=await sb.rpc('add_contract_version',{p_contract:c.id, p_kind:kind, p_file_path:path, p_file_name:fileName, p_size:blob.size, p_mime:blob.type||null,
    p_template_version:tv||null, p_comment:(comment||'').trim()||null, p_missing:missing&&missing.length?missing:null});
  if(error){ await sb.storage.from('contracts').remove([path]); throw error; }
  return data;
}

    const [tr, cx] = await Promise.all([sb.from('templates').select('*, template_versions!inner(*)').eq('archived',false).eq('template_versions.status','active').order('name'), loadDocData(c, d)]);

      const r=renderDocx(lib, b, tv.mapping, ctx); if(!dead) setRes({...r, tv, t}); }
      catch(e){ if(!dead) setErr(e&&e.properties?docxErrors(e):[errText(e)]); }
      if(!dead) setBusy(false); })();
    return ()=>{ dead=true; }; },[tid, ctx]);
  const save=async()=>{ if(!res) return; setBusy(true);

function SubjectPick({r, setR, sj, kind, cur}){

    .sort((a,b)=>(b.fit-a.fit)||a.l.localeCompare(b.l,'uk'));

}

        ${can(role,'head')&&html`<button class="btn" onClick=${()=>setImp(true)}>Імпорт з Excel</button>`}

        <thead><tr><th>Індекс</th><th>Назва / ПІБ</th><th>Категорія</th><th>ОПФ</th><th>ЄДРПОУ / РНОКПП</th><th>Email</th><th>Телефон</th><th>Статус</th></tr></thead>
        <tbody>${rows.map(r=>{ const c=d.categoriesBy[r.category_id]; return html`<tr key=${r.id} class="click" onClick=${()=>go('counterparties/'+r.id)}>
          <td class="nw"><b>${r.idx||'—'}</b></td><td>${r.name}</td><td class="nw">${c?c.name:'—'}</td><td>${(d.formsBy[r.legal_form_id]||{}).short||'—'}</td>
          <td class="nw">${r.tax_id||'—'}</td><td class="ell" style="max-width:200px">${r.email||'—'}</td><td class="nw">${r.phone||'—'}</td>
          <td>${r.active?html`<${Chip} c="green">Активний<//>`:html`<${Chip}>Неактивний<//>`}</td></tr>`; })}</tbody></table>`}
    </div><${Pager} page=${page} size=${CP_PAGE} total=${total} onPage=${setPage}/></div>
    ${edit&&html`<${CounterpartyForm} row=${edit} onClose=${()=>setEdit(null)} onSaved=${c=>{ setEdit(null); go('counterparties/'+c.id); }}/>`}
    ${imp&&html`<${ImportWizard} kind="counterparties" onClose=${()=>{ setImp(false); setTick(t=>t+1); }}/>`}`;
}

  const load=async()=>{ const {data,error}=await sb.from('counterparties').select('*').eq('id',id).maybeSingle(); if(error) toastErr(error); setC(data||false); };
  const loadContracts=async()=>{ const {data,error}=await sb.from('v_contracts').select('id,number,title,status,end_date,indefinite,days_left,project_code,project_name,amount,amount_type,currency_code').eq('counterparty_id',id).order('created_at',{ascending:false}); if(error) toastErr(error); setContracts(data||[]); };
  useEffect(()=>{ load(); loadContracts(); },[id]);
  if(c===null) return html`<${Loading}/>`;
  if(c===false) return html`<${Empty} title="Контрагента не знайдено або немає доступу"><a href="#/counterparties">До списку</a><//>`;
  const cat=d.categoriesBy[c.category_id], form=d.formsBy[c.legal_form_id], legal=can(role,'legal');
  const taxIss=taxIdIssue(c.tax_id, form&&form.person);
  const setTab=t=>setQuery({tab:t});
  return html`

      <div class="acts">${legal&&html`<button class="btn" onClick=${()=>setEdit(true)}>Редагувати</button><button class="btn primary" onClick=${()=>go('contracts/new?cp='+c.id)}>+ Новий договір</button>`}</div>
    </div>
    <${Tabs} value=${tab} onChange=${setTab} items=${[['main','Основне'],['requisites','Реквізити'],['contracts','Договори'+(contracts?' ('+contracts.length+')':'')],['documents','Документи'],['history','Історія']]}/>
    ${tab==='main'&&html`<div class="grid-main">
      <div class="card pad"><h3 style="margin-bottom:18px">Основне</h3><div class="kv">
        <div class="k">Індекс</div><div class="v">${c.idx?html`<b>${c.idx}</b>`:html`<span class="muted">не присвоєно — оберіть категорію</span>`}</div>
        <div class="k">Категорія</div><div class="v">${cat?cat.name+' ('+cat.prefix+')':'—'}</div>
        <div class="k">Тип (ОПФ)</div><div class="v">${form?form.short+' — '+form.name:'—'}</div>
        <div class="k">Назва / ПІБ</div><div class="v">${c.name}</div>
        <div class="k">Назва латиницею</div><div class="v">${c.name_latin||'—'}</div>
        <div class="k">${form&&form.person?'РНОКПП':'ЄДРПОУ / РНОКПП'}</div><div class="v">${c.tax_id||'—'}${taxIss&&taxIss.warn?html`<div class="small" style="color:var(--amber-t)">${taxIss.warn}</div>`:''}</div>
        <div class="k">Email</div><div class="v">${c.email?html`<a href=${'mailto:'+c.email}>${c.email}</a>`:'—'}</div>
        <div class="k">Телефон</div><div class="v">${c.phone||'—'}</div>
        <div class="k">Статус</div><div class="v">${c.active?'Активний':'Неактивний'}</div>
      </div></div>
      <div class="stack">
        <div class="card pad"><h3>Договори</h3>
          ${contracts===null?html`<p>…</p>`:contracts.length===0?html`<p>Договорів ще немає.</p>`:contracts.slice(0,6).map(r=>html`<div key=${r.id} class="list-row" onClick=${()=>go('contracts/'+r.id)}>
            <b class="lr-t" style="flex:1;color:var(--accent)">${r.number||'без номера'}</b><${StatusChip} s=${r.status}/></div>`)}
          ${contracts&&contracts.length>6&&html`<a href="javascript:void 0" onClick=${()=>setTab('contracts')}>Усі ${contracts.length} →</a>`}</div>
        <div class="card pad"><h3>Контроль дублювання</h3><p class="small">Основний ключ:</p><div class="b" style="margin:6px 0 12px">РНОКПП / ЄДРПОУ</div><p class="small">Індекс не перевикористовується.</p></div>
      </div></div>`}
    ${tab==='requisites'&&html`<div class="card pad" style="max-width:900px"><h3 style="margin-bottom:18px">Реквізити</h3><div class="kv">
      <div class="k">Адреса</div><div class="v">${c.address||'—'}</div>
      <div class="k">IBAN</div><div class="v">${c.iban||'—'}${c.iban&&!checkIban(c.iban)?html`<div class="small" style="color:var(--amber-t)">Контрольна сума IBAN не збігається</div>`:''}</div>
      <div class="k">Банк</div><div class="v">${c.bank_name||'—'}</div>
      ${(form&&form.person||c.fop_registration)&&html`<div class="k">Реєстрація ФОП</div><div class="v">${c.fop_registration||'—'}</div>`}
      ${(!(form&&form.person)||c.signatory_name)&&html`<div class="k">Підписант</div><div class="v">${[c.signatory_position,c.signatory_name].filter(Boolean).join(' ')||'—'}${c.signatory_basis?', що діє на підставі '+c.signatory_basis:''}${c.signatory_short?html`<div class="small muted">підпис: ${c.signatory_short}</div>`:''}</div>`}
      <div class="k">Контактна особа</div><div class="v">${c.contact||'—'}</div>
      <div class="k">Примітка</div><div class="v">${c.note||'—'}</div>
    </div><p class="small" style="margin-top:16px">Хто і коли змінював реквізити — на вкладці «Історія».</p></div>`}
    ${tab==='contracts'&&html`<div class="card">${contracts===null?html`<${Loading}/>`:contracts.length===0?html`<${Empty} title="Договорів ще немає"/>`:html`<table>
      <thead><tr><th>№ договору</th><th>Предмет</th><th>Проєкт</th><th class="num">Сума</th><th>Діє до</th><th>Статус</th></tr></thead>
      <tbody>${contracts.map(r=>html`<tr key=${r.id} class="click" onClick=${()=>go('contracts/'+r.id)}><td class="nw"><b>${r.number||'—'}</b></td><td class="ell">${r.title}</td>
        <td class="nw">${r.project_code||r.project_name||'—'}</td><td class="num nw">${fmtAmount(r)}</td><td class="nw">${r.indefinite?'безстроковий':fmtDate(r.end_date)||'—'}</td><td><${StatusChip} s=${r.status}/></td></tr>`)}</tbody></table>`}</div>`}
    ${tab==='documents'&&html`<div class="card pad"><p>Документи контрагента (виписки, довіреності тощо) — функціонал передбачено ТЗ, додамо після основних етапів.</p></div>`}
    ${tab==='history'&&html`<div class="card pad"><${EntityHistory} entity="counterparties" id=${c.id}/></div>`}
    ${edit&&html`<${CounterpartyForm} row=${c} onClose=${()=>setEdit(false)} onSaved=${()=>{ setEdit(false); load(); }}/>`}`;
}

function CounterpartyForm({row, onClose, onSaved}){
  const {role, d, reloadDicts} = useCtx();
  const isNew=!row.id;
  const [r,setR]=useState(()=>({active:true, ...row, idx: row.idx||''}));
  const [noTax,setNoTax]=useState(!isNew && !row.tax_id);
  const [dup,setDup]=useState(null); const [errs,setErrs]=useState({}); const [busy,setBusy]=useState(false); const [tried,setTried]=useState(false);
  const [latinTouched,setLatinTouched]=useState(!!row.name_latin);
  const set=(k,v)=>setR(p=>({...p,[k]:v}));
  const form=d.formsBy[r.legal_form_id]; const person=!!(form&&form.person); const isFop=form&&form.short==='ФОП';
  const cat=d.categoriesBy[r.category_id]; const lockedCat=!!row.idx;
  useEffect(()=>{ if(!latinTouched) set('name_latin', translitUA(r.name||'')); },[r.name]);
  useEffect(()=>{ const t=String(r.tax_id||'').replace(/\s/g,''); if(noTax||!/^\d{8,10}$/.test(t)){ setDup(null); return; }
    const h=setTimeout(async()=>{ let x=sb.from('counterparties').select('id,name,idx').eq('tax_id',t); if(r.id) x=x.neq('id',r.id); const {data}=await x.limit(1); setDup(data&&data[0]||null); },300);
    return ()=>clearTimeout(h); },[r.tax_id, noTax]);
  const taxIss = noTax ? null : taxIdIssue(r.tax_id, person);
  const validate=()=>{ const e={};
    if(!(r.name||'').trim()) e.name='Вкажіть назву або ПІБ';
    if(!r.category_id && !(r.idx||'').trim()) e.category='Оберіть категорію';
    if(!r.legal_form_id) e.legal_form='Оберіть ОПФ';
    if(!noTax && !String(r.tax_id||'').trim()) e.tax='Вкажіть код або позначте «Немає коду»';
    if(taxIss&&taxIss.error) e.tax=taxIss.error;
    if(dup) e.tax='Такий код уже є: '+dup.name+(dup.idx?' ('+dup.idx+')':'');
    if(r.email && !checkEmail(r.email)) e.email='Некоректний email';
    if(r.idx && isNew && !/^[A-Za-z]+\d+$/.test(r.idx.trim())) e.idx='Формат: префікс + номер, напр. S187';
    return e; };
  useEffect(()=>{ if(tried) setErrs(validate()); },[r, noTax, dup, tried]);
  const save=async()=>{ setTried(true); const e=validate(); setErrs(e); if(Object.keys(e).length) return; setBusy(true);
    const p={name:r.name.trim(), category_id:r.category_id||null, legal_form_id:r.legal_form_id||null, tax_id:noTax?null:String(r.tax_id||'').replace(/\s/g,'')||null,
      name_latin:(r.name_latin||'').trim()||null, email:(r.email||'').trim()||null, phone:(r.phone||'').trim()||null, address:(r.address||'').trim()||null,
      iban:(r.iban||'').trim()||null, bank_name:(r.bank_name||'').trim()||null, fop_registration:isFop?((r.fop_registration||'').trim()||null):(row.fop_registration||null),
      contact:(r.contact||'').trim()||null, note:(r.note||'').trim()||null, active:r.active!==false,
      signatory_position:(r.signatory_position||'').trim()||null, signatory_name:(r.signatory_name||'').trim()||null, signatory_basis:(r.signatory_basis||'').trim()||null, signatory_short:(r.signatory_short||'').trim()||null};
    if(isNew && can(role,'head') && (r.idx||'').trim()) p.idx=r.idx.trim().toUpperCase();
    if(lockedCat) delete p.category_id;
    const res = isNew ? await sb.from('counterparties').insert(p).select('*').single() : await sb.from('counterparties').update(p).eq('id',row.id).select('*').single();
    setBusy(false);
    if(res.error) return toastErr(res.error);
    pushToast(isNew?'Контрагента створено: '+(res.data.idx||''):'Збережено','ok');
    if(isNew) reloadDicts();
    onSaved(res.data); };
  const del=async()=>{ if(!confirm('Видалити контрагента «'+row.name+'»? Індекс '+(row.idx||'')+' не повернеться в нумерацію.')) return;
    const {error}=await sb.from('counterparties').delete().eq('id',row.id); if(error) return toastErr(error); pushToast('Контрагента видалено','ok'); go('counterparties'); };
  const nextIdx = cat ? cat.prefix+String(cat.next_sequence).padStart(3,'0') : '';
  return html`<${Modal} wide=${true} title=${isNew?'Новий контрагент':'Контрагент '+(row.idx||'')} onClose=${onClose}
    foot=${html`${!isNew&&can(role,'head')&&html`<button class="btn danger" style="margin-right:auto" onClick=${del}>Видалити</button>`}<button class="btn" onClick=${onClose}>Скасувати</button><button class="btn primary" onClick=${save} disabled=${busy}>${busy?html`<${Spinner}/>`:'Зберегти'}</button>`}>
    <div class="row2">
      <${Field} label="Категорія" req=${!r.idx} error=${errs.category} hint=${lockedCat?'Після присвоєння індексу категорія не змінюється':(nextIdx&&!r.idx?'Індекс присвоїться автоматично: '+nextIdx:'')}>
        <${SearchSelect} value=${r.category_id||''} disabled=${lockedCat} options=${d.categories.filter(c=>c.active||c.id===r.category_id).map(c=>({v:c.id,l:c.prefix+' — '+c.name}))} onChange=${v=>set('category_id',v)}/><//>
      ${isNew&&can(role,'head')?html`<${Field} label="Індекс, якщо вже присвоєний раніше" error=${errs.idx} hint="Для перенесення наявних контрагентів. Інакше залиште порожнім"><input value=${r.idx} placeholder="напр. S187" onInput=${e=>set('idx',e.target.value.toUpperCase())}/><//>`
        :html`<${Field} label="Індекс"><input disabled value=${row.idx||'присвоїться після збереження'}/><//>`}
    </div>
    <div class="row2">
      <${Field} label="ОПФ" req error=${errs.legal_form}><${SearchSelect} value=${r.legal_form_id||''} options=${d.forms.filter(f=>f.active||f.id===r.legal_form_id).map(f=>({v:f.id,l:f.short+' — '+f.name}))} onChange=${v=>set('legal_form_id',v)}/><//>
      <${Field} label=${person?'РНОКПП':'ЄДРПОУ / РНОКПП'} req=${!noTax} error=${errs.tax} warn=${taxIss&&taxIss.warn}>
        <input value=${noTax?'':(r.tax_id||'')} disabled=${noTax} inputmode="numeric" onInput=${e=>set('tax_id',e.target.value)}/>
        <div style="margin-top:6px"><${Check} checked=${noTax} onChange=${setNoTax}>Немає коду (іноземний контрагент)<//></div>
        ${dup&&html`<div class="small" style="margin-top:4px"><a href=${'#/counterparties/'+dup.id} onClick=${onClose}>Відкрити наявного контрагента →</a></div>`}<//>
    </div>
    <${Field} label="Назва / ПІБ" req error=${errs.name}><input value=${r.name||''} onInput=${e=>set('name',e.target.value)}/><//>
    <${Field} label="Назва латиницею" hint="Для назви фінального файлу. Заповнюється автоматично — можна виправити"><input value=${r.name_latin||''} onInput=${e=>{ setLatinTouched(true); set('name_latin',e.target.value); }}/><//>
    <div class="row2">
      <${Field} label="Email" error=${errs.email}><input value=${r.email||''} onInput=${e=>set('email',e.target.value)}/><//>
      <${Field} label="Телефон"><input value=${r.phone||''} onInput=${e=>set('phone',e.target.value)}/><//>
    </div>
    <${Field} label="Адреса"><input value=${r.address||''} onInput=${e=>set('address',e.target.value)}/><//>
    <div class="row2">
      <${Field} label="IBAN" warn=${r.iban&&!checkIban(r.iban)?'Контрольна сума IBAN не збігається — перевірте':''}><input value=${r.iban||''} onInput=${e=>set('iban',e.target.value)}/><//>
      <${Field} label="Банк"><input value=${r.bank_name||''} onInput=${e=>set('bank_name',e.target.value)}/><//>
    </div>
    ${isFop&&html`<${Field} label="Реєстрація ФОП" hint="Дата і номер запису в ЄДР"><input value=${r.fop_registration||''} onInput=${e=>set('fop_registration',e.target.value)}/><//>`}
    ${!person&&html`<div class="b small" style="margin:4px 0 8px">Підписант (для шаблонів договорів)</div>
      <div class="row2">
        <${Field} label="Посада — у родовому відмінку" hint="в особі директора…"><input value=${r.signatory_position||''} placeholder="директора" onInput=${e=>set('signatory_position',e.target.value)}/><//>
        <${Field} label="ПІБ — у родовому відмінку"><input value=${r.signatory_name||''} placeholder="Іваненка Петра Олександровича" onInput=${e=>set('signatory_name',e.target.value)}/><//>
      </div>
      <div class="row2">
        <${Field} label="Діє на підставі"><input value=${r.signatory_basis||''} placeholder="Статуту" onInput=${e=>set('signatory_basis',e.target.value)}/><//>
        <${Field} label="Підпис: Ім’я ПРІЗВИЩЕ"><input value=${r.signatory_short||''} placeholder="Петро ІВАНЕНКО" onInput=${e=>set('signatory_short',e.target.value)}/><//>
      </div>`}
    <div class="row2">
      <${Field} label="Контактна особа"><input value=${r.contact||''} onInput=${e=>set('contact',e.target.value)}/><//>
      <${Field} label="Примітка"><input value=${r.note||''} onInput=${e=>set('note',e.target.value)}/><//>
    </div>
    ${!isNew&&html`<${Check} checked=${r.active!==false} onChange=${v=>set('active',v)}>Активний (неактивні не пропонуються в нових договорах)<//>`}
  <//>`;
}

function DictModal({def, row, onClose, onSaved}){
  const isNew=!row.id;

  const set=(k,v)=>setR(p=>({...p,[k]:v}));
  const save=async()=>{ const e={};
    def.fields.forEach(f=>{ const v=r[f.k]; if(f.type==='check') return; const s=v==null?'':String(v).trim();
      if(f.req && !s) e[f.k]='Обов’язкове поле'; else if(s && f.re && !f.re.test(s)) e[f.k]=f.reMsg; });
    setErrs(e); if(Object.keys(e).length) return; setBusy(true);
    const p={active:r.active!==false};
    def.fields.forEach(f=>{ if(!isNew && f.lockOnEdit) return; let v=r[f.k]; if(f.type==='check') v=!!v; else { v=v==null?'':String(v).trim(); if(f.upper) v=v.toUpperCase(); v=v||null; } p[f.k]=v; });
    const res = isNew ? await sb.from(def.table).insert(p) : await sb.from(def.table).update(p).eq('id',row.id);
    setBusy(false); if(res.error) return toastErr(res.error); pushToast('Збережено','ok'); onSaved(); };
  const del=async()=>{ if(!confirm('Видалити запис? Якщо він уже використовується, система не дасть видалити — тоді зробіть його неактивним.')) return;
    const {error}=await sb.from(def.table).delete().eq('id',row.id); if(error) return toastErr(error); pushToast('Видалено','ok'); onSaved(); };
  const renderF = f => html`<${Field} key=${f.k} label=${f.type==='check'?'':f.l} req=${f.req} error=${errs[f.k]} hint=${f.hint}>
    ${f.type==='check'?html`<${Check} checked=${!!r[f.k]} onChange=${v=>set(f.k,v)}>${f.l}<//>`
      :html`<input type=${f.type||'text'} value=${r[f.k]||''} disabled=${!isNew&&f.lockOnEdit} onInput=${e=>set(f.k, f.upper?e.target.value.toUpperCase():e.target.value)}/>`}<//>`;
  const parts=[];
  for(let i=0;i<def.fields.length;i++){ const f=def.fields[i], g=def.fields[i+1];
    if(f.half && g && g.half){ parts.push(html`<div class="row2" key=${f.k}>${renderF(f)}${renderF(g)}</div>`); i++; } else parts.push(renderF(f)); }
  return html`<${Modal} title=${(isNew?'Новий запис':'Редагування')+' — '+def.t.toLowerCase()} onClose=${onClose}
    foot=${html`${!isNew&&html`<button class="btn danger" style="margin-right:auto" onClick=${del}>Видалити</button>`}<button class="btn" onClick=${onClose}>Скасувати</button><button class="btn primary" onClick=${save} disabled=${busy}>Зберегти</button>`}>
    ${parts}
    ${!isNew&&html`<${Check} checked=${r.active!==false} onChange=${v=>set('active',v)}>Активний (неактивні не пропонуються в нових договорах)<//>`}
  <//>`;
}

const KIND_WORDS = [[/^(фоп|фізична особа.?підприємець|fop)$/,'fop'],[/^(фо|фізична особа|цпх|фіз.?особа|person)$/,'person'],[/^(юо|юр.?особа|юридична особа|тов|організація|company)$/,'company'],[/^(будь.?який|усі|всі|any|)$/,'any']];
const normH = s => fold(String(s||'')).replace(/[^\p{L}\p{N}#]+/gu,' ').trim();
function autoMap(headers, fields){
  const map={}, used=new Set(), H=headers.map(normH);
  fields.forEach(f=>{ const cands=[f.l,...f.syn].map(normH); const i=H.findIndex((h,j)=>!used.has(j)&&h&&cands.includes(h)); if(i>=0){ map[f.k]=i; used.add(i); } });
  fields.forEach(f=>{ if(map[f.k]!=null) return; const cands=f.syn.map(normH).filter(s=>s.length>2); const i=H.findIndex((h,j)=>!used.has(j)&&h&&cands.some(s=>h.includes(s))); if(i>=0){ map[f.k]=i; used.add(i); } });
  return map;
}
const isoLocal = d => new Date(d.getFullYear(), d.getMonth(), d.getDate(), 12).toISOString().slice(0,10);
function cellStr(v, k){
  if(v==null) return '';
  if(v instanceof Date) return isNaN(v) ? '' : isoLocal(v);
  if(typeof v==='number'){ if(k==='tax_id'){ const s=String(Math.round(v)); return s.length>=5&&s.length<8 ? s.padStart(8,'0') : s; } return String(v); }
  return String(v).trim();
}
function parseDate(s){
  if(!s) return {v:''};
  if(/^\d{4}-\d{2}-\d{2}$/.test(s)) return {v:s};
  const m=s.match(/^(\d{1,2})[./-](\d{1,2})[./-](\d{2,4})$/);
  if(m){ const y=m[3].length===2?'20'+m[3]:m[3]; const iso=y+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0'); if(!isNaN(new Date(iso+'T12:00:00'))) return {v:iso}; }
  return {err:'незрозуміла дата «'+s+'»'};
}

      const hr=Math.max(0, a.findIndex(r=>r.filter(x=>String(x??'').trim()!=='').length>=2));

  const cnt = s => (rows||[]).filter(r=>r.status===s).length;
  const shown = (rows||[]).filter(r=>!onlyBad || r.status==='error' || r.warns.length).slice(0,500);
  const stChip = r => r.status==='error'?html`<${Chip} c="red">Помилка<//>`: r.status==='exists'?html`<${Chip} c="amber">${fill&&kind!=='subjects'?'Доповнити':'Уже є — пропустити'}<//>`: html`<${Chip} c="green">Буде створено<//>`;

  const repCols = [{l:'Рядок', x:r=>r.row}, {l:'Назва', x:r=>r.name||''}, {l:'Результат', x:r=>({created:'створено',updated:'доповнено',skipped:'пропущено (уже є)',error:'помилка'})[r.status]||r.status},
    ...(kind==='counterparties'?[{l:'Індекс', x:r=>r.idx||''}]:kind==='subjects'?[{l:'Код', x:r=>r.code||''}]:[]), {l:'Системний ID', x:r=>r.id||''}, {l:'Примітка', x:r=>r.message||''}];
  return html`<${Modal} xwide=${true} title=${def.title} sub=${file?file.name:'Excel (.xlsx, .xls) або CSV'} onClose=${busy?null:onClose}

      ${step===4&&html`<button class="btn" onClick=${()=>exportRows(result.report, repCols, 'Звіт імпорту '+today(), 'xlsx')}>Завантажити звіт (Excel)</button><button class="btn primary" onClick=${onClose}>Готово</button>`}
      ${step===1&&html`<button class="btn" onClick=${onClose}>Закрити</button>`}`}>
    <div class="steps">${['1. Файл','2. Колонки','3. Перевірка','4. Результат'].map((s,i)=>html`<span class=${'step'+(step>=i+1?' on':'')}>${s}</span>`)}</div>
    ${step===1&&html`<div>

        <label class="btn primary">${busy?html`<${Spinner}/>`:'Обрати файл'}<input type="file" accept=".xlsx,.xls,.csv" style="display:none" onChange=${onFile}/></label>
        <button class="btn" onClick=${sample}>Скачати зразок</button></div>
      <div class="note gray" style="margin-top:16px">${kind==='counterparties'
        ?'Імпорт спершу лише показує результат — нічого не створюється до кнопки «Імпортувати». Наявних контрагентів шукаємо за ЄДРПОУ / РНОКПП і не перезаписуємо. Якщо в колонці «Індекс» є наявні індекси (S187, AK031), вони зберігаються, а нумерація категорії продовжиться після найбільшого.'
        :kind==='subjects'?'Імпорт спершу лише показує результат — нічого не створюється до кнопки «Імпортувати». Код — латиницею (TUTOR_SBC); наявні коди пропускаються (нову редакцію робіть у бібліотеці). Тип контрагента: ФОП, ФО (ЦПХ), ЮО або порожньо — будь-який. Проєкт — за кодом (UNICEF#3).'
        :'Імпорт спершу лише показує результат — нічого не створюється до кнопки «Імпортувати». Наявні проєкти шукаємо за кодом (або за назвою, якщо коду немає) і не перезаписуємо.'}</div></div>`}
    ${step===2&&html`<div>

      <div class="row2">${def.fields.map(f=>html`<${Field} key=${f.k} label=${f.l} req=${f.req}>
        <select value=${map[f.k]==null?'':String(map[f.k])} onChange=${e=>setMap({...map, [f.k]: e.target.value===''?null:Number(e.target.value)})}>

async function inChunks(values, fn){ const out=[]; const u=[...new Set(values.filter(Boolean))]; for(let i=0;i<u.length;i+=150){ out.push(...await fn(u.slice(i,i+150))); } return out; }
async function validateCounterpartyRows(out, d){
  const catBy=Object.fromEntries(d.categories.map(c=>[c.prefix,c])); const formBy=Object.fromEntries(d.forms.map(f=>[f.short.toLowerCase(),f]));
  const seenTax={}, seenIdx={};
  out.forEach(r=>{ const x=r.data;
    x.name=(x.name||'').trim(); if(!x.name) r.errs.push('порожня назва');
    x.idx=(x.idx||'').toUpperCase().replace(/\s/g,''); x.category=(x.category||'').toUpperCase().trim();
    if(x.idx){ const m=x.idx.match(/^([A-Z]+)(\d+)$/); if(!m) r.errs.push('індекс «'+x.idx+'» має бути ПРЕФІКС+номер'); else if(!catBy[m[1]]) r.errs.push('немає категорії з префіксом '+m[1]); else if(x.category&&x.category!==m[1]) r.errs.push('індекс не відповідає категорії '+x.category); }
    if(x.category && !catBy[x.category]) r.errs.push('немає категорії «'+x.category+'»');
    if(!x.idx && !x.category) r.errs.push('потрібна категорія або індекс');
    const form = x.legal_form ? formBy[x.legal_form.toLowerCase()] : null;
    if(x.legal_form && !form) r.errs.push('невідома ОПФ «'+x.legal_form+'»');
    x.tax_id=(x.tax_id||'').replace(/\s/g,'');
    if(x.tax_id){ const iss=taxIdIssue(x.tax_id, form&&form.person); if(iss&&iss.error) r.errs.push('код: '+iss.error); else if(iss&&iss.warn) r.warns.push(iss.warn); }
    else r.warns.push('без коду дублікати не відстежуються');
    if(x.email && !checkEmail(x.email)) r.warns.push('email виглядає некоректно');
    if(x.iban && !checkIban(x.iban)) r.warns.push('IBAN: контрольна сума не збігається');
    if(x.tax_id){ if(seenTax[x.tax_id]) r.errs.push('дубль коду в файлі (рядок '+seenTax[x.tax_id]+')'); else seenTax[x.tax_id]=r.row; }
    if(x.idx){ if(seenIdx[x.idx]) r.errs.push('дубль індексу в файлі (рядок '+seenIdx[x.idx]+')'); else seenIdx[x.idx]=r.row; }
  });
  const byTax = Object.fromEntries((await inChunks(out.map(r=>r.data.tax_id), async ch=>{ const {data,error}=await sb.from('counterparties').select('id,name,idx,tax_id').in('tax_id',ch); if(error) throw error; return data; })).map(c=>[c.tax_id,c]));
  const byIdx = Object.fromEntries((await inChunks(out.map(r=>r.data.idx), async ch=>{ const {data,error}=await sb.from('counterparties').select('id,name,idx,tax_id').in('idx',ch); if(error) throw error; return data; })).map(c=>[c.idx,c]));
  out.forEach(r=>{ const x=r.data; const ex=x.tax_id&&byTax[x.tax_id];
    if(ex){ r.existing='(є: '+ex.name+(ex.idx?', '+ex.idx:'')+')'; if(!r.errs.length) r.status='exists'; }
    const exi=x.idx&&byIdx[x.idx]; if(exi && (!ex || exi.id!==ex.id)) r.errs.push('індекс '+x.idx+' уже має «'+exi.name+'»');
    if(r.errs.length) r.status='error';
  });
}
async function validateProjectRows(out, d){
  const byCode=Object.fromEntries(d.projects.filter(p=>p.short_code).map(p=>[p.short_code.toUpperCase(),p]));
  const byName=Object.fromEntries(d.projects.map(p=>[p.full_name.toLowerCase(),p]));
  const seen={};
  out.forEach(r=>{ const x=r.data;
    x.full_name=(x.full_name||'').trim(); if(!x.full_name) r.errs.push('порожня назва');
    x.short_code=(x.short_code||'').trim(); if(x.short_code && !/^[A-Za-z0-9#._-]{1,30}$/.test(x.short_code)) r.errs.push('код: лише латиниця, цифри, # . _ -');
    ['start_date','end_date'].forEach(k=>{ if(x[k]){ const p=parseDate(x[k]); if(p.err) r.errs.push(p.err); else x[k]=p.v; } });
    if(x.start_date && x.end_date && x.end_date<x.start_date) r.errs.push('завершення раніше за початок');
    const key=x.short_code?x.short_code.toUpperCase():'#'+x.full_name.toLowerCase();
    if(seen[key]) r.errs.push('дубль у файлі (рядок '+seen[key]+')'); else seen[key]=r.row;
    const ex = x.short_code ? byCode[x.short_code.toUpperCase()] : byName[x.full_name.toLowerCase()];
    if(ex){ r.existing='(є: '+projectLabel(ex)+')'; if(!r.errs.length) r.status='exists'; }
    if(r.errs.length) r.status='error';
  });
}

async function validateSubjectRows(out, d){
  const prj=Object.fromEntries(d.projects.filter(p=>p.short_code).map(p=>[p.short_code.toUpperCase(),p])); const seen={};
  out.forEach(r=>{ const x=r.data;
    x.code=(x.code||'').toUpperCase().trim().replace(/\s+/g,'_'); if(!/^[A-Z0-9_]{2,80}$/.test(x.code)) r.errs.push('код «'+(r.data.code||'')+'»: лише латиниця, цифри, _');
    x.name=(x.name||'').trim(); if(!x.name) r.errs.push('порожня назва');
    x.body=String(x.body||'').replace(/\r\n/g,'\n').trim(); if(!x.body) r.errs.push('порожній текст');
    const kw=fold(x.cp_kind||'').trim(); const km=KIND_WORDS.find(([re])=>re.test(kw)); if(km) x.cp_kind=km[1]; else { r.errs.push('тип контрагента «'+x.cp_kind+'»: ФОП / ФО / ЮО або порожньо'); }
    x.project=(x.project||'').trim(); if(x.project && !prj[x.project.toUpperCase()]) r.errs.push('немає проєкту з кодом '+x.project);
    if(x.code){ if(seen[x.code]) r.errs.push('дубль коду в файлі (рядок '+seen[x.code]+')'); else seen[x.code]=r.row; }
  });
  const ex=new Set((await inChunks(out.map(r=>r.data.code), async ch=>{ const {data,error}=await sb.from('subjects').select('code').in('code',ch); if(error) throw error; return data; })).map(x=>x.code));
  out.forEach(r=>{ if(ex.has(r.data.code)){ r.existing='(код уже є в бібліотеці)'; if(!r.errs.length) r.status='exists'; } if(r.errs.length) r.status='error'; });
}
