<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Юридичний облік — договірна робота</title>
<style>
  :root{--bg:#f6f5fb;--card:#fff;--line:#e7e5f0;--text:#1f1d2b;--muted:#6b6880;--muted-2:#a5a2b8;--accent:#7c5cff;--accent-h:#6a49f2;--green:#16a34a;--red:#e0483d;--amber:#d99a19;--teal:#0d9488;--radius:14px}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14px}
  h1{font-size:22px;margin:0 0 4px} h2{font-size:15px;margin:0} h3{font-size:16px;margin:0 0 12px}
  p{margin:0;color:var(--muted)}
  a{color:var(--accent-h)}
  .app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
  .side{background:#fff;border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow:auto}
  .brand{display:flex;align-items:center;gap:9px;padding:6px 8px 14px}
  .brand b{font-size:15px} .brand small{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.5px}
  .navgrp{font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted-2);font-weight:700;margin:12px 8px 4px}
  .nav{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:9px;cursor:pointer;color:var(--muted);font-weight:500}
  .nav:hover{background:#f4f2fc;color:var(--text)}
  .nav.on{background:#efeafb;color:var(--accent-h);font-weight:600}
  .nav .dot{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.5}
  .main{padding:24px 28px 60px;max-width:1500px;min-width:0}
  .head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
  .tbl-wrap{overflow:auto;max-height:calc(100vh - 210px);position:relative}
  .tbl-wrap thead th{position:sticky;top:0;z-index:2;background:#fafbfc;box-shadow:inset 0 -1px 0 var(--line)}
  table{width:100%;border-collapse:collapse}
  th{background:#fafbfc;text-align:left;font-size:11.5px;letter-spacing:.4px;text-transform:uppercase;color:var(--muted);font-weight:600;padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
  td{padding:11px 14px;border-bottom:1px solid #eef1f4;vertical-align:middle}
  tr:last-child td{border-bottom:0}
  tbody tr:hover{background:#faf9ff}
  .num{text-align:right;font-variant-numeric:tabular-nums}
  .btn{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);color:var(--text);padding:8px 14px;border-radius:9px;cursor:pointer;font-size:13px;font-weight:500}
  .btn:hover{background:#f7f6fc} .btn:disabled{opacity:.5;cursor:default}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff} .btn.primary:hover{background:var(--accent-h)}
  .btn.ghost{border-color:transparent;background:transparent;padding:6px 8px}
  .btn.ghost:hover{background:#f0eefb}
  .btn.sm{padding:5px 10px;font-size:12.5px}
  .chip{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11.5px;font-weight:600}
  .chip.gray{background:#eef0f4;color:#5b6472}.chip.green{background:#dcfce7;color:#15803d}.chip.amber{background:#fef3c7;color:#92600a}.chip.red{background:#fee2e2;color:#b91c1c}.chip.teal{background:#ccfbf1;color:#0f766e}.chip.violet{background:#ede9fe;color:#6d28d9}.chip.blue{background:#dbeafe;color:#1e40af}
  .fld{margin-bottom:12px} .fld label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:500}
  .fld input,.fld select,.fld textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;font-size:13.5px;font-family:inherit;background:#fff}
  .fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--accent)}
  .fld .hint{font-size:11.5px;color:var(--muted-2);margin-top:4px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px} .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 14px}
  .req{color:var(--red)}
  .ov{position:fixed;inset:0;background:rgba(30,25,50,.4);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:50;overflow:auto}
  .modal{background:#fff;border-radius:16px;width:100%;max-width:640px;box-shadow:0 20px 60px rgba(0,0,0,.2)}
  .modal.wide{max-width:900px}
  .modal h3{padding:18px 22px;border-bottom:1px solid var(--line);margin:0}
  .modal .body{padding:18px 22px;max-height:70vh;overflow:auto}
  .modal .foot{padding:14px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
  .empty{padding:40px;text-align:center;color:var(--muted)} .empty .big{font-size:16px;color:var(--text);margin-bottom:6px}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
  .kpi{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
  .kpi .l{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:600}
  .kpi .v{font-size:22px;font-weight:800;margin-top:6px}
  .spin{width:14px;height:14px;border:2px solid rgba(255,255,255,.5);border-top-color:#fff;border-radius:50%;display:inline-block;animation:sp .6s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1f1d2b;color:#fff;padding:11px 18px;border-radius:10px;font-size:13px;z-index:100;box-shadow:0 8px 24px rgba(0,0,0,.25)}
  .toast.err{background:#b91c1c}
  .ss{position:relative}
  .ss-pop{position:fixed;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 30px rgba(0,0,0,.15);z-index:60;max-height:280px;overflow:auto;min-width:220px}
  .ss-pop input{width:100%;padding:9px 11px;border:0;border-bottom:1px solid var(--line);outline:none;font-size:13.5px}
  .ss-opt{padding:8px 11px;cursor:pointer;font-size:13.5px} .ss-opt:hover{background:#f4f2fc}
  .auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .auth .box{background:#fff;border:1px solid var(--line);border-radius:16px;padding:28px;width:100%;max-width:380px;box-shadow:0 12px 40px rgba(0,0,0,.08)}
  .lnk{color:var(--accent-h);cursor:pointer;font-size:12.5px}
  .ver{font-size:11px;color:var(--muted-2);padding:0 8px 8px}
  .mbar{display:none}
  @media(max-width:820px){.app{grid-template-columns:1fr}.side{position:fixed;left:-260px;transition:.2s;z-index:70}.side.open{left:0}.kpis{grid-template-columns:1fr 1fr}.grid2,.grid3{grid-template-columns:1fr}
    .main{padding:0 14px 60px}
    .mbar{display:flex;align-items:center;gap:8px;position:sticky;top:0;z-index:40;background:#fff;border-bottom:1px solid var(--line);margin:0 -14px 16px;padding:8px 12px}
    .mback{position:fixed;inset:0;background:rgba(30,25,50,.35);z-index:65}}
</style>
</head>
<body>
<div id="app"></div>
<script>
  window.APP_CONFIG = {
    SUPABASE_URL: 'https://fjoovdjaffbfpjzrohyw.supabase.co',
    SUPABASE_ANON_KEY: 'sb_publishable_zi5ebYCPLyBN6mCwV6m36A_gW_XmIxv'   // publishable — публічний; секретний ключ (sb_secret_…) сюди НІКОЛИ
  };
</script>
<script type="module">
import { h, render } from 'https://esm.sh/preact@10.19.3';
import { useState, useEffect, useMemo, useCallback } from 'https://esm.sh/preact@10.19.3/hooks';
import htm from 'https://esm.sh/htm@3.1.1';
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.39.3';

const html = htm.bind(h);
const APP_VERSION = '1.1 · 24.09.2026';   // міняти при кожному оновленні: видно в меню і на екрані входу
const CFG = window.APP_CONFIG || {};
const cfgOk = !!(CFG.SUPABASE_URL && CFG.SUPABASE_ANON_KEY && !/ВАШ/.test(CFG.SUPABASE_URL + CFG.SUPABASE_ANON_KEY));
const sb = cfgOk ? createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY) : null;

/* ---------------- helpers ---------------- */
const fmtNum = v => (v==null||v==='')?'':Number(v).toLocaleString('uk-UA',{minimumFractionDigits:2,maximumFractionDigits:2});
const normNum = v => { if(v==null||v==='')return null; if(typeof v==='number')return v; const n=Number(String(v).replace(/\s/g,'').replace(',','.').replace(/[^\d.\-]/g,'')); return isNaN(n)?null:n; };
const today = () => { const d=new Date(); return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10); };   // локальна дата, не UTC
const daysTo = d => { if(!d)return null; const ms=new Date(d+'T00:00:00')-new Date(today()+'T00:00:00'); return Math.round(ms/86400000); };
const fmtDate = d => d ? d.slice(8,10)+'.'+d.slice(5,7)+'.'+d.slice(0,4) : '';
const fmtTs = t => { if(!t)return ''; const d=new Date(t); return isNaN(d)?'':d.toLocaleDateString('uk-UA'); };   // мітка часу → локальна дата
const fmtSize = b => { if(!b)return ''; if(b<1024)return b+' Б'; if(b<1048576)return (b/1024).toFixed(0)+' КБ'; return (b/1048576).toFixed(1)+' МБ'; };
// Storage приймає в шляху лише латиницю, цифри й кілька знаків: кирилицю транслітеруємо, решту замінюємо на _.
// Оригінальна назва зберігається в contract_files.file_name і повертається при завантаженні.
const TR = {а:'a',б:'b',в:'v',г:'h',ґ:'g',д:'d',е:'e',є:'ie',ж:'zh',з:'z',и:'y',і:'i',ї:'i',й:'i',к:'k',л:'l',м:'m',н:'n',о:'o',п:'p',р:'r',с:'s',т:'t',у:'u',ф:'f',х:'kh',ц:'ts',ч:'ch',ш:'sh',щ:'shch',ь:'',ю:'iu',я:'ia',ы:'y',э:'e',ъ:'',ё:'io'};
const safeName = n => { let s=String(n||'').toLowerCase().replace(/['’ʼ`]/g,'').split('').map(c=>TR[c]??c).join('').replace(/[^a-z0-9.\-]+/g,'_').replace(/_+/g,'_').replace(/_\./g,'.').replace(/^_+|_+$/g,''); if(!s||s[0]==='.')s='file'+s; return s.slice(-120); };
let toastFn=null; const pushToast=(m,k)=>toastFn&&toastFn(m,k);

const STATUS = [
  {v:'draft',      l:'Чернетка',      c:'gray'},
  {v:'in_review',  l:'На погодженні', c:'amber'},
  {v:'signed',     l:'Підписано',     c:'blue'},
  {v:'active',     l:'Чинний',        c:'green'},
  {v:'expired',    l:'Завершено',     c:'gray'},
  {v:'terminated', l:'Розірвано',     c:'red'},
  {v:'archived',   l:'Архів',         c:'violet'},
];
const stMap = Object.fromEntries(STATUS.map(s=>[s.v,s]));
const LIVE = ['draft','in_review','signed','active'];   // для цих статусів відстежуємо строки
const ROLE_L = {admin:'Адміністратор',lawyer:'Юрист',viewer:'Перегляд'};
const KIND =[{v:'company',l:'Юр. особа'},{v:'person',l:'Фіз. особа'},{v:'gov',l:'Держ. орган'}];
const kindMap = Object.fromEntries(KIND.map(k=>[k.v,k.l]));

function SearchSelect({value,options,onChange,placeholder,disabled}){
  const [open,setOpen]=useState(false); const [q,setQ]=useState(''); const [pos,setPos]=useState(null);
  const cur=options.find(o=>o.v===value);
  const filt=options.filter(o=>o.l.toLowerCase().includes(q.toLowerCase()));
  const openIt=e=>{ if(disabled)return; const r=e.currentTarget.getBoundingClientRect(); setPos({left:r.left,top:r.bottom+4,width:Math.max(r.width,220)}); setOpen(true); setQ(''); };
  return html`<div class="ss">
    <button type="button" class="btn" style="width:100%;justify-content:space-between" onClick=${openIt} disabled=${!!disabled}>
      <span style=${cur?'':'color:var(--muted-2)'}>${cur?cur.l:(placeholder||'— оберіть —')}</span><span style="color:var(--muted-2)">▾</span>
    </button>
    ${open&&html`<${Backdrop} onClose=${()=>setOpen(false)}/>
      <div class="ss-pop" style=${`left:${pos.left}px;top:${pos.top}px;width:${pos.width}px`}>
        <input autofocus placeholder="Пошук…" value=${q} onInput=${e=>setQ(e.target.value)}/>
        <div class="ss-opt" style="color:var(--muted-2)" onClick=${()=>{onChange('');setOpen(false);}}>— очистити —</div>
        ${filt.map(o=>html`<div class="ss-opt" key=${o.v} onClick=${()=>{onChange(o.v);setOpen(false);}}>${o.l}</div>`)}
        ${filt.length===0&&html`<div class="ss-opt" style="color:var(--muted-2)">нічого не знайдено</div>`}
      </div>`}
  </div>`;
}
function Backdrop({onClose}){ return html`<div style="position:fixed;inset:0;z-index:55" onClick=${onClose}></div>`; }
function Overlay({onClose,children,wide}){
  return html`<div class="ov" onMouseDown=${e=>{e.currentTarget._dov=(e.target===e.currentTarget);}} onClick=${e=>{if(e.currentTarget._dov&&e.target===e.currentTarget)onClose();}}>
    <div class=${'modal'+(wide?' wide':'')}>${children}</div></div>`;
}

/* ---------------- Auth ---------------- */
function Auth(){
  const [email,setEmail]=useState(''); const [pw,setPw]=useState(''); const [busy,setBusy]=useState(false); const [err,setErr]=useState('');
  const login=async()=>{ setErr(''); setBusy(true); const {error}=await sb.auth.signInWithPassword({email:email.trim(),password:pw}); setBusy(false); if(error)setErr(error.message); };
  return html`<div class="auth"><div class="box">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:18px">${Bee(30)}<div><b style="font-size:16px">Юридичний облік</b><div style="color:var(--muted);font-size:12px">Договірна робота</div></div></div>
    <div class="fld"><label>Email</label><input value=${email} onInput=${e=>setEmail(e.target.value)} onKeyDown=${e=>e.key==='Enter'&&login()}/></div>
    <div class="fld"><label>Пароль</label><input type="password" value=${pw} onInput=${e=>setPw(e.target.value)} onKeyDown=${e=>e.key==='Enter'&&login()}/></div>
    ${err&&html`<div style="color:var(--red);font-size:12.5px;margin-bottom:10px">${err}</div>`}
    <button class="btn primary" style="width:100%;justify-content:center" onClick=${login} disabled=${busy}>${busy?html`<span class="spin"></span>`:'Увійти'}</button>
    <div class="ver" style="text-align:center;padding:12px 0 0">версія ${APP_VERSION}</div>
  </div></div>`;
}

function NoConfig(){
  return html`<div class="auth"><div class="box">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px">${Bee(30)}<b style="font-size:16px">Юридичний облік</b></div>
    <p style="color:var(--text);margin-bottom:8px">Програма ще не підключена до бази.</p>
    <p>Впишіть <b>SUPABASE_URL</b> і <b>SUPABASE_ANON_KEY</b> у блок <code>window.APP_CONFIG</code> на початку файлу index.html: Project URL і ключ anon / publishable із налаштувань проєкту Supabase.</p>
    <div class="ver" style="text-align:center;padding:14px 0 0">версія ${APP_VERSION}</div>
  </div></div>`;
}

function NoAccess({session,onRetry}){
  return html`<div class="auth"><div class="box">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px">${Bee(30)}<b style="font-size:16px">Юридичний облік</b></div>
    <p style="color:var(--text);margin-bottom:8px">Доступ ще не надано.</p>
    <p>Обліковий запис <b>${session.user.email}</b> створено, але роль не призначено. Зверніться до адміністратора, потім натисніть «Оновити».</p>
    <div style="display:flex;gap:8px;margin-top:16px"><button class="btn primary" onClick=${onRetry}>Оновити</button><button class="btn" onClick=${()=>sb.auth.signOut()}>Вийти</button></div>
  </div></div>`;
}

const Bee = (s=28) => html`<svg width=${s} height=${s} viewBox="0 0 32 32" fill="none" style="flex-shrink:0"><ellipse cx="9.5" cy="12.5" rx="4.2" ry="2.7" fill="#fff" fill-opacity="0.9" stroke="#d9c9a0" stroke-width="0.8" transform="rotate(-28 9.5 12.5)"/><ellipse cx="22.5" cy="12.5" rx="4.2" ry="2.7" fill="#fff" fill-opacity="0.9" stroke="#d9c9a0" stroke-width="0.8" transform="rotate(28 22.5 12.5)"/><ellipse cx="16" cy="19.5" rx="8.4" ry="6.6" fill="#F6C945"/><path d="M11.4 15c1.6-1 7.6-1 9.2 0M8.3 19.5h15.4M10.6 24c1.4.8 9.4.8 10.8 0" stroke="#3a2e1e" stroke-width="1.7" stroke-linecap="round"/><circle cx="16" cy="9.2" r="3.1" fill="#3a2e1e"/><circle cx="14.9" cy="8.6" r="0.75" fill="#fff"/><path d="M14.3 6.4 12.6 4.2M17.7 6.4 19.4 4.2" stroke="#3a2e1e" stroke-width="1.4" stroke-linecap="round"/><circle cx="12.6" cy="4.2" r="1" fill="#3a2e1e"/><circle cx="19.4" cy="4.2" r="1" fill="#3a2e1e"/></svg>`;

/* ---------------- Shell ---------------- */
function Shell({session}){
  const [view,setView]=useState('dashboard');
  const [role,setRole]=useState(null);
  const [openM,setOpenM]=useState(false);
  const loadRole=()=>{ setRole(null); sb.from('profiles').select('role').eq('id',session.user.id).maybeSingle().then(({data})=>setRole(data?.role||'none')); };
  useEffect(loadRole,[]);
  if(role===null) return html`<div class="empty" style="padding-top:120px">Завантаження…</div>`;
  if(!ROLE_L[role]) return html`<${NoAccess} session=${session} onRetry=${loadRole}/>`;
  const nav=[
    {g:'Огляд',items:[['dashboard','Дашборд']]},
    {g:'Робота',items:[['contracts','Договори']]},
    {g:'Довідники',items:[['counterparties','Контрагенти'],['types','Типи договорів']]},
  ];
  let content;
  if(view==='dashboard') content=html`<${Dashboard} go=${setView}/>`;
  else if(view==='contracts') content=html`<${Contracts} role=${role}/>`;
  else if(view==='counterparties') content=html`<${Counterparties} role=${role}/>`;
  else if(view==='types') content=html`<${Types} role=${role}/>`;
  return html`<div class="app">
    ${openM&&html`<div class="mback" onClick=${()=>setOpenM(false)}></div>`}
    <div class=${'side'+(openM?' open':'')}>
      <div class="brand">${Bee(30)}<div><b>Юридичний облік</b><small>Договірна робота</small></div></div>
      ${nav.map(gr=>html`<${_F} key=${gr.g}>
        <div class="navgrp">${gr.g}</div>
        ${gr.items.map(([k,l])=>html`<div class=${'nav'+(view===k?' on':'')} key=${k} onClick=${()=>{setView(k);setOpenM(false);}}><span class="dot"></span>${l}</div>`)}
      <//>`)}
      <div style="flex:1"></div>
      <div style="font-size:12px;color:var(--muted);padding:8px">${session.user.email}<div style="margin-top:2px;color:var(--muted-2)">${ROLE_L[role]}</div></div>
      <div class="ver">версія ${APP_VERSION}</div>
      <button class="btn sm" onClick=${()=>sb.auth.signOut()}>Вийти</button>
    </div>
    <div class="main">
      <div class="mbar"><button class="btn ghost" style="font-size:18px;padding:4px 10px" aria-label="Меню" onClick=${()=>setOpenM(true)}>☰</button>${Bee(22)}<b>Юридичний облік</b></div>
      ${content}
    </div>
  </div>`;
}
const _F = (p)=>p.children;

/* ---------------- Dashboard ---------------- */
function Dashboard({go}){
  const [rows,setRows]=useState(null);
  useEffect(()=>{ sb.from('contracts').select('id,title,number,status,end_date,deadline,amount,currency_code,counterparties(name)').then(({data})=>setRows(data||[])); },[]);
  if(rows===null) return html`<div class="empty">Завантаження…</div>`;
  const active=rows.filter(r=>r.status==='active').length;
  const review=rows.filter(r=>r.status==='in_review').length;
  const live=rows.filter(r=>LIVE.includes(r.status));   // завершені, розірвані й архівні не нагадуємо
  const soon=live.filter(r=>{const d=daysTo(r.deadline||r.end_date); return d!==null&&d>=0&&d<=30;});
  const overdue=live.filter(r=>{const d=daysTo(r.deadline||r.end_date); return d!==null&&d<0;});
  return html`
    <div class="head"><div><h1>Дашборд</h1><p>Огляд договірної роботи</p></div></div>
    <div class="kpis">
      <div class="kpi"><div class="l">Усього договорів</div><div class="v">${rows.length}</div></div>
      <div class="kpi"><div class="l">Чинні</div><div class="v" style="color:var(--green)">${active}</div></div>

      <div class="kpi"><div class="l">Строк ≤ 30 днів</div><div class="v" style="color:${soon.length?'var(--amber)':'inherit'}">${soon.length}</div></div>

      <table><tbody>${overdue.map(r=>html`<tr key=${r.id}><td>${r.number?r.number+' · ':''}${r.title}</td><td>${r.counterparties?.name||''}</td><td class="num" style="color:var(--red);white-space:nowrap">${fmtDate(r.deadline||r.end_date)} · ${-daysTo(r.deadline||r.end_date)} дн. тому</td></tr>`)}</tbody></table>
    </div>`}
    <div class="card"><div style="padding:12px 16px;font-weight:600;border-bottom:1px solid var(--line)">Найближчі строки (30 днів)</div>
      ${soon.length===0?html`<div class="empty">Немає найближчих строків.</div>`:html`<table><thead><tr><th>Договір</th><th>Контрагент</th><th>Статус</th><th class="num">Строк</th><th class="num">Днів</th></tr></thead><tbody>
        ${soon.sort((a,b)=>(a.deadline||a.end_date)<(b.deadline||b.end_date)?-1:1).map(r=>{const d=daysTo(r.deadline||r.end_date);const s=stMap[r.status]; return html`<tr key=${r.id}><td>${r.number?r.number+' · ':''}${r.title}</td><td>${r.counterparties?.name||''}</td><td>${s?html`<span class=${'chip '+s.c}>${s.l}</span>`:''}</td><td class="num">${fmtDate(r.deadline||r.end_date)}</td><td class="num" style="color:${d<=7?'var(--red)':'var(--amber)'}">${d}</td></tr>`})}
      </tbody></table>`}
    </div>`;
}

function Contracts({role}){

  const [rows,setRows]=useState(null);
  const [cps,setCps]=useState([]);
  const [types,setTypes]=useState([]);
  const [q,setQ]=useState(''); const [fStatus,setFStatus]=useState('');
  const [edit,setEdit]=useState(null);
  const load=async()=>{ const {data}=await sb.from('contracts').select('*,counterparties(name),contract_types(name)').order('created_at',{ascending:false}); setRows(data||[]);
    const c=await sb.from('counterparties').select('id,name').eq('active',true).order('name'); setCps(c.data||[]);
    const t=await sb.from('contract_types').select('id,name').eq('active',true).order('name'); setTypes(t.data||[]);
  };
  useEffect(()=>{load();},[]);
  const list=(rows||[]).filter(r=>{
    if(fStatus&&r.status!==fStatus)return false;
    if(q){ const s=((r.number||'')+' '+r.title+' '+(r.counterparties?.name||'')+' '+(r.subject||'')).toLowerCase(); if(!s.includes(q.toLowerCase()))return false; }
    return true;
  });
  return html`
    <div class="head">
      <div><h1>Договори</h1><p>Реєстр договорів: сторони, сума, статус, строки, файли.</p></div>
      ${editable&&html`<button class="btn primary" onClick=${()=>setEdit({})}>+ Договір</button>`}
    </div>
    <div class="card" style="padding:12px 14px;margin-bottom:14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap">
      <input placeholder="Пошук за номером, назвою, контрагентом…" value=${q} onInput=${e=>setQ(e.target.value)} style="flex:1;min-width:220px;padding:9px 11px;border:1px solid var(--line);border-radius:9px"/>
      <select value=${fStatus} onChange=${e=>setFStatus(e.target.value)} style="padding:9px 11px;border:1px solid var(--line);border-radius:9px"><option value="">Усі статуси</option>${STATUS.map(s=>html`<option value=${s.v}>${s.l}</option>`)}</select>
    </div>
    <div class="card tbl-wrap">
      ${rows===null?html`<div class="empty">Завантаження…</div>`:list.length===0?html`<div class="empty"><div class="big">Договорів не знайдено</div>${editable?'Натисніть «+ Договір», щоб додати перший.':''}</div>`:
      html`<table><thead><tr><th>Номер</th><th>Назва / предмет</th><th>Контрагент</th><th class="num">Сума</th><th>Статус</th><th>Підписано</th><th>Діє до</th><th>Строк</th>${editable?html`<th></th>`:''}</tr></thead><tbody>
        ${list.map(r=>{const s=stMap[r.status]; const d=daysTo(r.deadline||r.end_date); const warn=LIVE.includes(r.status)&&d!==null&&d<=30; return html`<tr key=${r.id} style="cursor:pointer" onClick=${()=>setEdit(r)}>
          <td style="white-space:nowrap">${r.number||'—'}</td>
          <td><div style="font-weight:500">${r.title}</div>${r.subject?html`<div style="color:var(--muted);font-size:12px;max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${r.subject}</div>`:''}</td>
          <td>${r.counterparties?.name||'—'}</td>
          <td class="num" style="white-space:nowrap">${r.amount!=null?fmtNum(r.amount)+' '+(r.currency_code||''):'—'}</td>
          <td>${s?html`<span class=${'chip '+s.c}>${s.l}</span>`:r.status}</td>
          <td style="white-space:nowrap">${fmtDate(r.sign_date)||'—'}</td>
          <td style="white-space:nowrap">${fmtDate(r.end_date)||'—'}</td>
          <td style="white-space:nowrap;color:${warn?(d<0?'var(--red)':'var(--amber)'):'var(--muted)'}">${r.deadline||r.end_date?(fmtDate(r.deadline||r.end_date)+(warn?` (${d} дн.)`:'')):'—'}</td>
          ${editable?html`<td style="text-align:right" onClick=${e=>e.stopPropagation()}><button class="btn ghost sm" onClick=${()=>setEdit(r)}>✎</button></td>`:''}

    ${edit&&html`<${ContractModal} row=${edit} cps=${cps} types=${types} editable=${editable} onClose=${()=>setEdit(null)} onSaved=${()=>{setEdit(null);load();}} onEditRow=${x=>{setEdit(x);load();}}/>`}`;
}

function ContractModal({row,cps,types,editable,onClose,onSaved,onEditRow}){
  const isNew=!row.id;
  const [r,setR]=useState(()=>({status:'draft',currency_code:'UAH',our_org:'',...row}));
  const [busy,setBusy]=useState(false);
  const [files,setFiles]=useState([]);
  const [up,setUp]=useState(false);
  const set=(k,v)=>setR(p=>({...p,[k]:v}));
  const loadFiles=async()=>{ if(!row.id){setFiles([]);return;} const {data}=await sb.from('contract_files').select('*').eq('contract_id',row.id).order('uploaded_at'); setFiles(data||[]); };
  useEffect(()=>{loadFiles();},[row.id]);
  const cpOpts=cps.map(c=>({v:c.id,l:c.name}));
  if(r.counterparty_id&&!cps.some(c=>c.id===r.counterparty_id)&&row.counterparties) cpOpts.push({v:r.counterparty_id,l:row.counterparties.name+' (неактивний)'});
  const tOpts=types.map(t=>({v:t.id,l:t.name}));
  if(r.type_id&&!types.some(t=>t.id===r.type_id)&&row.contract_types) tOpts.push({v:r.type_id,l:row.contract_types.name+' (неактивний)'});
  const save=async()=>{
    if(!r.title||!r.title.trim()){pushToast('Вкажіть назву договору','err');return;}
    setBusy(true);
    const payload={number:r.number||null,title:r.title.trim(),counterparty_id:r.counterparty_id||null,our_org:r.our_org||null,type_id:r.type_id||null,subject:r.subject||null,amount:normNum(r.amount),currency_code:r.currency_code||'UAH',status:r.status||'draft',sign_date:r.sign_date||null,start_date:r.start_date||null,end_date:r.end_date||null,deadline:r.deadline||null,responsible:r.responsible||null,note:r.note||null};
    const res=isNew?await sb.from('contracts').insert(payload).select('*,counterparties(name),contract_types(name)').single():await sb.from('contracts').update(payload).eq('id',row.id).select('*,counterparties(name),contract_types(name)').single();
    setBusy(false);
    if(res.error){pushToast(res.error.message,'err');return;}
    pushToast('Збережено','ok');
    if(isNew){ onEditRow(res.data); }   // лишаємось у вікні, тепер можна додати файли
    else onSaved();
  };
  const onFile=async e=>{ const list=[...e.target.files]; e.target.value=''; if(!list.length||!row.id)return;
    setUp(true); let ok=0; const errs=[];
    for(let i=0;i<list.length;i++){ const file=list[i];
      const path=`${row.id}/${Date.now()+i}_${safeName(file.name)}`;   // у шляху лише латиниця; оригінальна назва — у file_name
      const {error}=await sb.storage.from('contracts').upload(path,file,{upsert:false});
      if(error){errs.push(file.name+': '+error.message);continue;}
      const {error:ie}=await sb.from('contract_files').insert({contract_id:row.id,file_path:path,file_name:file.name,size:file.size});
      if(ie){await sb.storage.from('contracts').remove([path]); errs.push(file.name+': '+ie.message); continue;}
      ok++;
    }
    setUp(false);
    if(errs.length) pushToast((ok?'Додано: '+ok+'. ':'')+'Не завантажено — '+errs.join('; '),'err');
    else pushToast(ok===1?'Файл додано':'Додано файлів: '+ok,'ok');
    loadFiles();
  };
  const openFile=async f=>{ const w=window.open('','_blank');   // вікно відкриваємо одразу: Safari блокує вікна, відкриті після await
    const {data,error}=await sb.storage.from('contracts').createSignedUrl(f.file_path,3600);
    if(error||!data?.signedUrl){ if(w)w.close(); pushToast('Файл: '+(error?.message||'не вдалося відкрити'),'err'); return; }
    if(w) w.location.href=data.signedUrl; else pushToast('Браузер заблокував нове вікно — дозвольте спливаючі вікна для цього сайту','err'); };
  const dlFile=async f=>{ const {data,error}=await sb.storage.from('contracts').download(f.file_path);
    if(error){pushToast('Файл: '+error.message,'err');return;}
    const url=URL.createObjectURL(data); const a=document.createElement('a'); a.href=url; a.download=f.file_name||'file';
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),10000); };
  const delFile=async f=>{ if(!confirm('Видалити файл «'+f.file_name+'»?'))return;
    const {error}=await sb.storage.from('contracts').remove([f.file_path]);
    if(error){pushToast('Файл: '+error.message,'err');return;}
    const {error:de}=await sb.from('contract_files').delete().eq('id',f.id);
    if(de){pushToast(de.message,'err');return;}
    pushToast('Файл видалено','ok'); loadFiles(); };

  return html`<${Overlay} onClose=${onClose} wide=${true}>
    <h3>${isNew?'Новий договір':'Договір'}${r.number?' № '+r.number:''}</h3>
    <div class="body">
      <div class="grid3">
        <div class="fld"><label>Номер</label><input value=${r.number||''} onInput=${e=>set('number',e.target.value)} disabled=${!editable}/></div>
        <div class="fld"><label>Статус</label><select value=${r.status} onChange=${e=>set('status',e.target.value)} disabled=${!editable}>${STATUS.map(s=>html`<option value=${s.v}>${s.l}</option>`)}</select></div>
        <div class="fld"><label>Тип договору</label><${SearchSelect} value=${r.type_id||''} options=${tOpts} placeholder="—" onChange=${x=>set('type_id',x)} disabled=${!editable}/></div>
      </div>
      <div class="fld"><label>Назва / предмет коротко <span class="req">*</span></label><input value=${r.title||''} onInput=${e=>set('title',e.target.value)} disabled=${!editable}/></div>
      <div class="grid2">
        <div class="fld"><label>Контрагент</label><${SearchSelect} value=${r.counterparty_id||''} options=${cpOpts} placeholder="— оберіть —" onChange=${x=>set('counterparty_id',x)} disabled=${!editable}/></div>
        <div class="fld"><label>Наша сторона</label><input value=${r.our_org||''} onInput=${e=>set('our_org',e.target.value)} disabled=${!editable}/></div>
      </div>
      <div class="fld"><label>Предмет договору (повний)</label><textarea rows="2" value=${r.subject||''} onInput=${e=>set('subject',e.target.value)} disabled=${!editable}></textarea></div>
      <div class="grid3">
        <div class="fld"><label>Сума</label><input type="number" step="0.01" value=${r.amount??''} onInput=${e=>set('amount',e.target.value)} disabled=${!editable}/></div>
        <div class="fld"><label>Валюта</label><input value=${r.currency_code||'UAH'} onInput=${e=>set('currency_code',e.target.value.toUpperCase())} disabled=${!editable}/></div>
        <div class="fld"><label>Відповідальний</label><input value=${r.responsible||''} onInput=${e=>set('responsible',e.target.value)} disabled=${!editable}/></div>
      </div>
      <div class="grid3">
        <div class="fld"><label>Дата підписання</label><input type="date" value=${r.sign_date||''} onInput=${e=>set('sign_date',e.target.value)} disabled=${!editable}/></div>
        <div class="fld"><label>Дата початку</label><input type="date" value=${r.start_date||''} onInput=${e=>set('start_date',e.target.value)} disabled=${!editable}/></div>
        <div class="fld"><label>Діє до</label><input type="date" value=${r.end_date||''} onInput=${e=>set('end_date',e.target.value)} disabled=${!editable}/></div>
      </div>
      <div class="grid2">
        <div class="fld"><label>Контрольний строк (продовження/повідомлення)</label><input type="date" value=${r.deadline||''} onInput=${e=>set('deadline',e.target.value)} disabled=${!editable}/><div class="hint">за цим полем працюють нагадування на дашборді</div></div>
        <div class="fld"><label>Примітка</label><input value=${r.note||''} onInput=${e=>set('note',e.target.value)} disabled=${!editable}/></div>
      </div>

      <div style="border-top:1px solid var(--line);margin-top:6px;padding-top:14px">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
          <b style="font-size:13.5px">Файли договору (скани / PDF)</b>
          ${editable&&(isNew?html`<span style="font-size:12px;color:var(--muted-2)">Спершу збережіть договір</span>`:html`<label class="btn sm">${up?html`<span class="spin" style="border-top-color:var(--accent)"></span>`:'+ Додати файли'}<input type="file" multiple onChange=${onFile} disabled=${up} style="display:none"/></label>`)}
        </div>
        ${files.length===0?html`<div style="color:var(--muted-2);font-size:13px;padding:6px 0">Файлів ще немає.</div>`:html`<div class="card"><table><tbody>
          ${files.map(f=>html`<tr key=${f.id}><td><span style="cursor:pointer;color:var(--accent-h)" title="Відкрити" onClick=${()=>openFile(f)}>📄 ${f.file_name}</span></td><td class="num" style="color:var(--muted);white-space:nowrap">${fmtSize(f.size)}</td><td style="text-align:right;white-space:nowrap">${fmtTs(f.uploaded_at)} <button class="btn ghost sm" title="Завантажити з оригінальною назвою" onClick=${()=>dlFile(f)}>⬇</button>${editable?html`<button class="btn ghost sm" title="Видалити" onClick=${()=>delFile(f)} style="color:var(--red)">✕</button>`:''}</td></tr>`)}
        </tbody></table></div>`}
      </div>
    </div>
    <div class="foot">
      <button class="btn" onClick=${onClose}>${editable?'Закрити':'Закрити'}</button>
      ${editable&&html`<button class="btn primary" onClick=${save} disabled=${busy}>${busy?html`<span class="spin"></span>`:(isNew?'Зберегти':'Зберегти зміни')}</button>`}
    </div>
  <//>`;
}

    <div class="head"><div><h1>Типи договорів</h1><p>Довідник типів (необов'язково).</p></div>${editable&&html`<button class="btn primary" onClick=${()=>setEdit({active:true})}>+ Тип</button>`}</div>
    <div class="card tbl-wrap">${rows===null?html`<div class="empty">Завантаження…</div>`:rows.length===0?html`<div class="empty">Порожньо.</div>`:
      html`<table><thead><tr><th>Назва</th>${editable?html`<th></th>`:''}</tr></thead><tbody>${rows.map(r=>html`<tr key=${r.id} style="cursor:pointer" onClick=${()=>setEdit(r)}><td>${r.name}</td>${editable?html`<td style="text-align:right" onClick=${e=>e.stopPropagation()}><button class="btn ghost sm" onClick=${()=>setEdit(r)}>✎</button></td>`:''}</tr>`)}</tbody></table>`}</div>
    ${edit&&html`<${TypeModal} row=${edit} editable=${editable} onClose=${()=>setEdit(null)} onSaved=${()=>{setEdit(null);load();}}/>`}`;
}
function TypeModal({row,editable,onClose,onSaved}){
  const isNew=!row.id; const [name,setName]=useState(row.name||''); const [busy,setBusy]=useState(false);
  const save=async()=>{ if(!name.trim()){pushToast('Вкажіть назву','err');return;} setBusy(true);
    const res=isNew?await sb.from('contract_types').insert({name:name.trim(),active:true}):await sb.from('contract_types').update({name:name.trim()}).eq('id',row.id); setBusy(false);
    if(res.error){pushToast(res.error.message,'err');return;} onSaved(); };
  const del=async()=>{ if(!confirm('Видалити тип?'))return;
    const {count,error:ce}=await sb.from('contracts').select('id',{count:'exact',head:true}).eq('type_id',row.id);
    if(ce){pushToast(ce.message,'err');return;}
    if(count>0){pushToast('Тип використано в договорах ('+count+'), видалити не можна.','err');return;}
    const {error}=await sb.from('contract_types').delete().eq('id',row.id); if(error){pushToast(error.message,'err');return;} onSaved(); };
  return html`<${Overlay} onClose=${onClose}><h3>${isNew?'Новий тип':'Тип договору'}</h3>
    <div class="body"><div class="fld"><label>Назва <span class="req">*</span></label><input value=${name} onInput=${e=>setName(e.target.value)} disabled=${!editable} autofocus/></div></div>
    <div class="foot">${editable&&!isNew&&html`<button class="btn" style="color:var(--red);margin-right:auto" onClick=${del}>Видалити</button>`}<button class="btn" onClick=${onClose}>Закрити</button>${editable&&html`<button class="btn primary" onClick=${save} disabled=${busy}>${busy?html`<span class="spin"></span>`:'Зберегти'}</button>`}</div>
  <//>`;
}

/* ---------------- Root ---------------- */
function App(){
  const [session,setSession]=useState(undefined);
  const [toast,setToast]=useState(null);
  useEffect(()=>{ let t; toastFn=(m,k)=>{ clearTimeout(t); setToast({m,k}); t=setTimeout(()=>setToast(null),k==='err'?6000:3000); };
    sb.auth.getSession().then(({data})=>setSession(data.session));
    const {data:sub}=sb.auth.onAuthStateChange((_e,s)=>setSession(s));
    return ()=>sub.subscription.unsubscribe();
  },[]);
  if(session===undefined) return html`<div class="empty" style="padding-top:120px">Завантаження…</div>`;
  return html`${session?html`<${Shell} session=${session}/>`:html`<${Auth}/>`}${toast&&html`<div class=${'toast'+(toast.k==='err'?' err':'')}>${toast.m}</div>`}`;
}
render(html`<${cfgOk?App:NoConfig}/>`, document.getElementById('app'));
</script>
</body>
</html>
