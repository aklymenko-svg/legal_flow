/* ---------------- форматування ---------------- */
const fmtNum = v => (v==null||v==='')?'':Number(v).toLocaleString('uk-UA',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtMoney = v => { if(v==null||v==='') return ''; const n=Number(v); return n.toLocaleString('uk-UA',{minimumFractionDigits:(Math.round(n*100)%100)?2:0,maximumFractionDigits:2}); };
const normNum = v => { if(v==null||v==='')return null; if(typeof v==='number')return v; const n=Number(String(v).replace(/\s/g,'').replace(',','.').replace(/[^\d.\-]/g,'')); return isNaN(n)?null:n; };
const today = () => { const d=new Date(); return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10); };
const addDays = (iso, n) => { const d=new Date(iso+'T12:00:00'); d.setDate(d.getDate()+n); return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10); };
const daysTo = d => { if(!d)return null; const ms=new Date(d+'T00:00:00')-new Date(today()+'T00:00:00'); return Math.round(ms/86400000); };
const fmtDate = d => d ? d.slice(8,10)+'.'+d.slice(5,7)+'.'+d.slice(0,4) : '';
const fmtTs = t => { if(!t)return ''; const d=new Date(t); return isNaN(d)?'':d.toLocaleDateString('uk-UA'); };
const fmtDT = t => { if(!t)return ''; const d=new Date(t); return isNaN(d)?'':d.toLocaleDateString('uk-UA')+' '+d.toLocaleTimeString('uk-UA',{hour:'2-digit',minute:'2-digit'}); };
const fmtSize = b => { if(!b)return ''; if(b<1024)return b+' Б'; if(b<1048576)return (b/1024).toFixed(0)+' КБ'; return (b/1048576).toFixed(1)+' МБ'; };
const longDate = () => { const s=new Date().toLocaleDateString('uk-UA',{weekday:'long',day:'numeric',month:'long',year:'numeric'}); return s.charAt(0).toUpperCase()+s.slice(1); };
const plural = (n, one, few, many) => { const a=Math.abs(n)%100, b=a%10; return (a>10&&a<20)?many:(b===1?one:(b>=2&&b<=4?few:many)); };
const shortName = full => { if(!full) return ''; if(full.includes('@')) return full; const p=full.trim().split(/\s+/); return p.length>1 ? p[0].charAt(0)+'. '+p.slice(1).join(' ') : full; };
const fold = s => String(s||'').toLowerCase().replace(/[’ʼ`]/g, "'");   // так само, як cf_fold у базі

// транслітерація за постановою КМУ № 55 (для назви латиницею)
const TRL = {а:'a',б:'b',в:'v',г:'h',ґ:'g',д:'d',е:'e',ж:'zh',з:'z',и:'y',і:'i',к:'k',л:'l',м:'m',н:'n',о:'o',п:'p',р:'r',с:'s',т:'t',у:'u',ф:'f',х:'kh',ц:'ts',ч:'ch',ш:'sh',щ:'shch',ь:'',ы:'y',э:'e',ъ:'',ё:'io'};
const TRL_START = {є:'ye',ї:'yi',й:'y',ю:'yu',я:'ya'}, TRL_MID = {є:'ie',ї:'i',й:'i',ю:'iu',я:'ia'};
const isL = c => !!c && /\p{L}/u.test(c);
const isUp = c => !!c && c !== c.toLowerCase() && c === c.toUpperCase();
function translitUA(s){
  const ch=[...String(s||'')]; let out='';
  const back = i => { let j=i-1; while(j>=0 && /['’ʼ`]/.test(ch[j])) j--; return ch[j]||''; };   // попередня літера без апострофа
  for(let i=0;i<ch.length;i++){
    const c=ch[i], lo=c.toLowerCase(), prev=back(i), next=ch[i+1]||'';
    if(/['’ʼ`]/.test(c) && isL(ch[i-1]) && isL(next)) continue;
    let t;
    if(lo==='г' && prev.toLowerCase()==='з') t='gh';
    else if(TRL_START[lo]!==undefined) t = isL(prev) ? TRL_MID[lo] : TRL_START[lo];
    else if(TRL[lo]!==undefined) t = TRL[lo];
    else { out+=c; continue; }
    if(isUp(c) && t){ t = (isUp(next) || (isUp(prev) && !isL(next))) ? t.toUpperCase() : t.charAt(0).toUpperCase()+t.slice(1); }
    out+=t;
  }
  return out;
}
// шлях у Storage: лише латиниця, цифри, . і -
const safeName = n => { let s=translitUA(String(n||'')).toLowerCase().replace(/[^a-z0-9.\-]+/g,'_').replace(/_+/g,'_').replace(/_\./g,'.').replace(/^_+|_+$/g,''); if(!s||s[0]==='.')s='file'+s; return s.slice(-120); };

/* ---------------- перевірки ---------------- */
function checkEdrpou(c){
  if(!/^\d{8}$/.test(c)) return false;
  const d=[...c].map(Number), n=Number(c);
  const w=(n<30000000||n>60000000)?[1,2,3,4,5,6,7]:[7,1,2,3,4,5,6];
  let s=w.reduce((a,x,i)=>a+x*d[i],0)%11;
  if(s>=10){ s=w.map(x=>x+2).reduce((a,x,i)=>a+x*d[i],0)%11; if(s>=10) s=0; }
  return s===d[7];
}
function checkRnokpp(c){
  if(!/^\d{10}$/.test(c)) return false;
  const d=[...c].map(Number), w=[-1,5,7,9,4,6,10,5,7];
  const s=w.reduce((a,x,i)=>a+x*d[i],0);
  return ((s%11)+11)%11%10===d[9];
}
function checkIban(v){
  const s=String(v||'').replace(/\s/g,'').toUpperCase();
  if(!/^[A-Z]{2}\d{2}[A-Z0-9]{10,30}$/.test(s)) return false;
  if(s.startsWith('UA') && s.length!==29) return false;
  const r=(s.slice(4)+s.slice(0,4)).replace(/[A-Z]/g,c=>String(c.charCodeAt(0)-55));
  let m=0; for(const c of r) m=(m*10+Number(c))%97;

  return {path:p.split('/').filter(Boolean).map(decodeURIComponent), query:Object.fromEntries(new URLSearchParams(qs))};
}

}

function downloadBlob(blob, name){
  const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),10000);
}
async function exportRows(rows, cols, fileBase, kind){
  const data = rows.map(r=>Object.fromEntries(cols.map(c=>[c.l, c.x ? c.x(r) : (r[c.k] ?? '')])));
  if(kind==='csv'){
    const esc = v => { const s=v==null?'':String(v); return /[";\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; };
    const lines=[cols.map(c=>esc(c.l)).join(';'), ...data.map(r=>cols.map(c=>esc(r[c.l])).join(';'))];
    downloadBlob(new Blob(['﻿'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'}), fileBase+'.csv');
    return;
  }
  const X = await loadXLSX();
  const ws = X.utils.json_to_sheet(data, {header:cols.map(c=>c.l)});
  ws['!cols'] = cols.map(c=>({wch: Math.min(60, Math.max(10, c.l.length+2, ...data.slice(0,300).map(r=>String(r[c.l]??'').length+1)))}));
  const wb = X.utils.book_new(); X.utils.book_append_sheet(wb, ws, 'Дані');
  const out = X.write(wb, {bookType:'xlsx', type:'array'});
  downloadBlob(new Blob([out],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}), fileBase+'.xlsx');
}

function regQuery(st, me, opts){
  let q = sb.from('v_contracts').select('*', opts||{count:'exact'});
  const f = st.f||{};
  if(st.q && st.q.trim()) q = q.like('search_text', '%'+fold(st.q.trim())+'%');
  if(f.status && f.status.length) q = q.in('status', f.status);
  if(f.project_id) q = q.eq('project_id', f.project_id);
  if(f.donor) q = q.eq('project_donor', f.donor);
  if(f.type_id) q = q.eq('type_id', f.type_id);
  if(f.category) q = q.eq('cp_category', f.category);
  if(f.lawyer_id) q = f.lawyer_id==='none' ? q.is('lawyer_id', null) : q.eq('lawyer_id', f.lawyer_id);
  if(f.date_from) q = q.gte('contract_date', f.date_from);
  if(f.date_to) q = q.lte('contract_date', f.date_to);
  if(f.end_from) q = q.gte('end_date', f.end_from);
  if(f.end_to) q = q.lte('end_date', f.end_to);
  if(st.quick==='mine') q = q.eq('lawyer_id', me.id).not('status', 'in', '('+TERMINAL.join(',')+')');
  if(st.quick==='awaiting') q = q.in('status', ['in_vchasno','awaiting_signature']);
  if(st.quick==='ending') q = q.eq('status','active').eq('indefinite',false).gte('end_date', today()).lte('end_date', addDays(today(), st.days||30));
  if(st.quick==='overdue') q = q.eq('status','active').eq('indefinite',false).lt('end_date', today());
  const s = st.sort||{col:'created_at',dir:'desc'};
  q = q.order(s.col, {ascending: s.dir==='asc', nullsFirst:false});
  if(s.col!=='created_at') q = q.order('created_at', {ascending:false});
  return q;
}

function ColumnChooser({value, onChange}){
  const move = (k, dir) => { const a=[...value]; const i=a.indexOf(k), j=i+dir; if(i<0||j<0||j>=a.length) return; [a[i],a[j]]=[a[j],a[i]]; onChange(a); };
  const toggle = k => onChange(value.includes(k) ? value.filter(x=>x!==k) : [...value, k]);
  const ordered = [...value.map(k=>REG_COLS.find(c=>c.k===k)).filter(Boolean), ...REG_COLS.filter(c=>!value.includes(c.k))];
  return html`<div class="pop" style="min-width:280px">
    ${ordered.map(c=>{ const on=value.includes(c.k); return html`<div key=${c.k} class="it" style="justify-content:space-between">
      <label class="check" style="flex:1"><input type="checkbox" checked=${on} disabled=${on&&value.length<=2} onChange=${()=>toggle(c.k)}/> ${c.l}</label>
      ${on&&html`<span style="display:flex;gap:2px"><button class="btn ghost sm" onClick=${()=>move(c.k,-1)} title="Вище">↑</button><button class="btn ghost sm" onClick=${()=>move(c.k,1)} title="Нижче">↓</button></span>`}</div>`; })}
    <div class="it" style="justify-content:center;color:var(--accent)" onClick=${()=>onChange(REG_DEFAULT_COLS)}>Як за замовчуванням</div>
  </div>`;
}

function SaveViewModal({onClose, onSave}){

  const save=async()=>{ if(!name.trim()) return; setBusy(true); await onSave(name.trim()); setBusy(false); };

const searchCounterparties = async q => {
  let x = sb.from('counterparties').select('id,name,idx,tax_id,category_id').eq('active',true).order('name').limit(20);
  if(q && q.trim()) x = x.like('search_text', '%'+fold(q.trim())+'%');
  const {data,error} = await x; if(error) throw error;
  return (data||[]).map(c=>({v:c.id, l:c.name, sub:[c.idx||'без індексу', c.tax_id].filter(Boolean).join(' • '), c}));
};
function FRow({label, req, error, warn, hint, children}){
  return html`<div class=${'frow'+(error?' bad':'')}><label>${label}${req&&html` <span class="req">*</span>`}</label><div class="fld" style="margin:0">${children}
    ${error?html`<div class="err">${error}</div>`:warn?html`<div class="warn">${warn}</div>`:hint?html`<div class="hint">${hint}</div>`:''}</div></div>`;
}

function validateContract(r, isNew, cp){
  const e={};
  if(isNew){ if(!cp) e.cp='Оберіть контрагента'; else if(!cp.idx) e.cp='У контрагента немає індексу — оберіть йому категорію в картці контрагента'; if(!r.project_id) e.project='Оберіть проєкт'; }
  if(!r.type_id) e.type='Оберіть тип договору';
  if(!(r.title||'').trim()) e.title='Вкажіть предмет';
  if(r.amount_type!=='none' && r.amount!==''&&r.amount!=null && normNum(r.amount)==null) e.amount='Некоректна сума';
  if(!r.indefinite && r.start_date && r.end_date && r.end_date<r.start_date) e.end='Завершення раніше за початок';
  if(r.worksection_url && !/^https?:\/\//i.test(r.worksection_url.trim())) e.ws='Посилання має починатися з https://';
  return e;
}
function NewContract({cpId}){

  const [errs,setErrs]=useState({}); const [newCp,setNewCp]=useState(false); const [tried,setTried]=useState(false);
  const set=(k,v)=>setR(p=>({...p,[k]:v}));
  useEffect(()=>{ if(cpId) sb.from('counterparties').select('id,name,idx,tax_id,category_id').eq('id',cpId).maybeSingle().then(({data})=>data&&setCp(data)); },[cpId]);

        <${FRow} label="Проєкт" req error=${errs.project}><${SearchSelect} value=${r.project_id||''} options=${d.projects.filter(p=>p.active).map(p=>({v:p.id,l:projectLabel(p),sub:p.donor||''}))} onChange=${v=>set('project_id',v)}/><//>
        <${FRow} label="Тип договору" req error=${errs.type}><${SearchSelect} value=${r.type_id||''} options=${d.types.filter(t=>t.active).map(t=>({v:t.id,l:t.name}))} onChange=${v=>set('type_id',v)}/><//>
        <${FRow} label="Шаблон" hint="Генерація за шаблоном з’явиться на етапі 2"><input disabled placeholder="—"/><//>
        <${FRow} label="Предмет" req error=${errs.title}><input value=${r.title} placeholder="Коротко, наприклад: Організаційний супровід освітніх активностей" onInput=${e=>set('title',e.target.value)}/><//>
        <${FRow} label="Повний текст предмета"><textarea rows="3" value=${r.subject} onInput=${e=>set('subject',e.target.value)}></textarea><//>
        <${FRow} label="Сума" error=${errs.amount}><${AmountInputs} r=${r} set=${set}/><//>

        <${FRow} label="Строк" error=${errs.end}><${TermInputs} r=${r} set=${set}/><//>
        <${FRow} label="Юрист"><${SearchSelect} value=${r.lawyer_id||''} options=${lawyers.map(u=>({v:u.id,l:userLabel(u)}))} onChange=${v=>set('lawyer_id',v)} placeholder="Не призначено"/><//>
        <${FRow} label="Worksection" error=${errs.ws} hint="Посилання на задачу"><input value=${r.worksection_url||''} placeholder="https://…/task/12874" onInput=${e=>set('worksection_url',e.target.value)}/><//>
        <${FRow} label="Примітка"><input value=${r.note||''} onInput=${e=>set('note',e.target.value)}/><//>
      </div>
      <div class="card pad">
        <h3>Номер</h3>

function FilesPanel({contractId, files, reload, editable}){
  const [up,setUp]=useState(false);
  const onFile=async e=>{ const list=[...e.target.files]; e.target.value=''; if(!list.length) return;
    setUp(true); let ok=0; const errs=[];
    for(let i=0;i<list.length;i++){ const file=list[i];
      const path=`${contractId}/${Date.now()+i}_${safeName(file.name)}`;   // у шляху лише латиниця; оригінальна назва — у file_name
      const {error}=await sb.storage.from('contracts').upload(path,file,{upsert:false});
      if(error){ errs.push(file.name+': '+errText(error)); continue; }
      const {error:ie}=await sb.from('contract_files').insert({contract_id:contractId,file_path:path,file_name:file.name,size:file.size});
      if(ie){ await sb.storage.from('contracts').remove([path]); errs.push(file.name+': '+errText(ie)); continue; }
      ok++;
    }
    setUp(false);
    if(errs.length) pushToast((ok?'Додано: '+ok+'. ':'')+'Не завантажено — '+errs.join('; '),'err'); else pushToast(ok===1?'Файл додано':'Додано файлів: '+ok,'ok');
    reload();
  };
  const openFile=async f=>{ const w=window.open('','_blank');   // вікно відкриваємо одразу: Safari блокує вікна, відкриті після await
    const {data,error}=await sb.storage.from('contracts').createSignedUrl(f.file_path,3600);
    if(error||!data?.signedUrl){ if(w) w.close(); return pushToast('Файл: '+(error?errText(error):'не вдалося відкрити'),'err'); }
    if(w) w.location.href=data.signedUrl; else pushToast('Браузер заблокував нове вікно — дозвольте спливаючі вікна для цього сайту','err'); };
  const dlFile=async f=>{ const {data,error}=await sb.storage.from('contracts').download(f.file_path); if(error) return pushToast('Файл: '+errText(error),'err'); downloadBlob(data, f.file_name||'file'); };
  const delFile=async f=>{ if(!confirm('Видалити файл «'+f.file_name+'»?')) return;
    const {error}=await sb.storage.from('contracts').remove([f.file_path]); if(error) return pushToast('Файл: '+errText(error),'err');
    const {error:de}=await sb.from('contract_files').delete().eq('id',f.id); if(de) return toastErr(de);
    pushToast('Файл видалено','ok'); reload(); };
  return html`<div>
    <div class="ctitle"><h3 style="margin:0">Файли договору</h3>
      ${editable&&html`<label class="btn sm">${up?html`<${Spinner} dark=${true}/>`:'+ Додати файли'}<input type="file" multiple onChange=${onFile} disabled=${up} style="display:none"/></label>`}</div>
    ${files===null?html`<${Loading}/>`:files.length===0?html`<p>Файлів ще немає.</p>`:html`<table><tbody>
      ${files.map(f=>html`<tr key=${f.id}><td><a href="javascript:void 0" title="Відкрити" onClick=${()=>openFile(f)}>📄 ${f.file_name}</a></td><td class="num muted nw">${fmtSize(f.size)}</td>
        <td class="nw" style="text-align:right">${fmtTs(f.uploaded_at)} <button class="btn ghost sm" title="Завантажити з оригінальною назвою" onClick=${()=>dlFile(f)}>⬇</button>${editable&&html`<button class="btn ghost sm" title="Видалити" onClick=${()=>delFile(f)} style="color:var(--red)">✕</button>`}</td></tr>`)}
    </tbody></table>`}
  </div>`;
}

const ENTITY_L = {contracts:'Договір', counterparties:'Контрагент', projects:'Проєкт', counterparty_categories:'Категорія контрагентів', legal_forms:'ОПФ',
  contract_types:'Тип договору', document_types:'Тип документа', contract_files:'Файл договору', profiles:'Користувач'};
const FIELD_L = {number:'Номер', title:'Предмет', subject:'Повний текст предмета', counterparty_id:'Контрагент', project_id:'Проєкт', type_id:'Тип договору', amount:'Сума',

  worksection_url:'Worksection', status:'Статус', note:'Примітка', needs_extension:'Потребує продовження', seq_no:'Порядковий номер', number_assigned_at:'Номер присвоєно',
  package_id:'Пакет', name:'Назва', idx:'Індекс', category_id:'Категорія', legal_form_id:'ОПФ', tax_id:'ЄДРПОУ / РНОКПП', name_latin:'Назва латиницею', address:'Адреса',
  iban:'IBAN', bank_name:'Банк', email:'Email', phone:'Телефон', fop_registration:'Реєстрація ФОП', contact:'Контактна особа', active:'Активний', role:'Роль', full_name:'Назва / ПІБ',
  file_name:'Файл', short_code:'Код', donor:'Донор / партнер', prefix:'Префікс', next_sequence:'Наступний номер', short:'Скорочення', person:'Фізична особа',
  sign_date:'Дата підписання', deadline:'Контрольна дата', responsible:'Відповідальний (старе поле)', our_org:'Наша сторона', kind:'Тип (старе поле)'};
const HIDE_F = ['id','created_at','created_by','updated_at','search_text','import_batch_id','edrpou','uploaded_at','uploaded_by','file_path','size','contract_id'];
function useRefNames(entries){
  const {d} = useCtx(); const [cps,setCps]=useState({});
  useEffect(()=>{ const ids=new Set(); (entries||[]).forEach(e=>['old_data','new_data'].forEach(k=>{ const v=e[k]&&e[k].counterparty_id; if(v) ids.add(v); }));
    const need=[...ids].filter(x=>!cps[x]); if(!need.length) return;
    sb.from('counterparties').select('id,name,idx').in('id',need).then(({data})=>{ if(data) setCps(p=>({...p, ...Object.fromEntries(data.map(x=>[x.id, x.name+(x.idx?' ('+x.idx+')':'')]))})); }); },[entries]);
  return (k, v) => {
    if(v==null || v==='') return '—';
    switch(k){
      case 'counterparty_id': return cps[v]||'…';
      case 'project_id': return projectLabel(d.projectsBy[v])||'—';
      case 'type_id': return (d.typesBy[v]||{}).name||'—';
      case 'lawyer_id': return userLabel(d.usersBy[v])||'—';
      case 'category_id': { const x=d.categoriesBy[v]; return x?x.prefix+' — '+x.name:'—'; }
      case 'legal_form_id': return (d.formsBy[v]||{}).short||'—';
      case 'status': return (stMap[v]||{}).l||v;
      case 'amount_type': return amMap[v]||v;
      case 'role': return roleL[v]||v;
      case 'amount': return fmtMoney(v);
    }
    if(typeof v==='boolean') return v?'так':'ні';
    if(/(_date|^deadline)$/.test(k) && typeof v==='string') return fmtDate(v);
    if(/_at$/.test(k)) return fmtDT(v);
    return String(v);
  };
}
function histSummary(e){
  const o=e.old_data||{}, n=e.new_data||{};
  if(e.entity==='contract_files') return e.action==='insert'?'Додано файл «'+n.file_name+'»':e.action==='delete'?'Видалено файл «'+o.file_name+'»':'Змінено файл';
  if(e.action==='insert') return e.entity==='contracts'?'Створено договір':e.entity==='counterparties'?'Створено контрагента'+(n.idx?' '+n.idx:''):'Створено: '+(ENTITY_L[e.entity]||e.entity).toLowerCase();
  if(e.action==='delete') return 'Видалено: '+(ENTITY_L[e.entity]||e.entity).toLowerCase();
  if((e.changed||[]).includes('number') && !o.number && n.number) return 'Присвоєно номер '+n.number;
  if((e.changed||[]).includes('number')) return 'Технічна зміна номера';
  if((e.changed||[]).length===1 && e.changed[0]==='status') return 'Змінено статус';
  return 'Змінено';
}
function HistoryItems({entries, showEntity}){
  const fv = useRefNames(entries);
  if(!entries.length) return html`<p>Змін ще немає.</p>`;
  return html`<div class="hist">${entries.map(e=>{
    const keys=(e.action==='update'?(e.changed||[]):[]).filter(k=>!HIDE_F.includes(k)&&!(k==='number'&&!(e.old_data||{}).number)&&k!=='number_assigned_at'&&k!=='seq_no');
    const ent = showEntity ? (e.entity==='contracts'?html` · <a href=${'#/contracts/'+e.entity_id}>договір</a>`:e.entity==='counterparties'?html` · <a href=${'#/counterparties/'+e.entity_id}>контрагент</a>`:e.entity==='contract_files'&&e.parent_id?html` · <a href=${'#/contracts/'+e.parent_id}>договір</a>`:' · '+(ENTITY_L[e.entity]||e.entity)) : '';
    return html`<div class="it" key=${e.id}>
      <div><b>${histSummary(e)}</b>${ent}</div>
      <div class="small muted">${fmtDT(e.at)} · ${e.actor_email||'система'}</div>
      ${keys.length>0&&html`<div class="ch">${keys.map(k=>html`<div key=${k}>${FIELD_L[k]||k}: <span class="muted">${fv(k,(e.old_data||{})[k])}</span> → <b>${fv(k,(e.new_data||{})[k])}</b></div>`)}</div>`}
      ${e.reason&&html`<div class="ch">Причина: «${e.reason}»</div>`}
    </div>`; })}</div>`;
}
function EntityHistory({entity, id, withFiles}){
  const [rows,setRows]=useState(null);
  useEffect(()=>{ let q=sb.from('audit_log').select('*').order('at',{ascending:false}).limit(300);
    q = withFiles ? q.or(`and(entity.eq.${entity},entity_id.eq.${id}),parent_id.eq.${id}`) : q.eq('entity',entity).eq('entity_id',id);
    q.then(({data,error})=>{ if(error){ toastErr(error); setRows([]); } else setRows(data); }); },[entity,id]);
  if(rows===null) return html`<${Loading}/>`;
  return html`<${HistoryItems} entries=${rows}/>`;
}

    <div class="head"><div><h1>Контрагенти</h1><p>${total==null?'…':total.toLocaleString('uk-UA')+' '+plural(total,'контрагент','контрагенти','контрагентів')}</p></div>

    <div class="card" style="padding:12px 14px;margin-bottom:14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap">
      <input class="inp" style="flex:1;min-width:240px" placeholder="Пошук за назвою / ПІБ, індексом, ЄДРПОУ / РНОКПП…" value=${q} onInput=${e=>setQ(e.target.value)}/>
      <div style="width:240px"><${SearchSelect} value=${cat} options=${d.categories.map(c=>({v:c.id,l:c.prefix+' — '+c.name}))} onChange=${v=>{setCat(v);setPage(0);}} placeholder="Усі категорії"/></div>
      <${Check} checked=${inactive} onChange=${v=>{setInactive(v);setPage(0);}}>Показати неактивних<//>
    </div>
    <div class="card"><div class="tbl-wrap">
      ${rows===null?html`<${Loading}/>`:rows.length===0?html`<${Empty} title="Нікого не знайдено"/>`:html`<table>
        <thead><tr><th>Індекс</th><th>Назва / ПІБ</th><th>Категорія</th><th>ОПФ</th><th>ЄДРПОУ / РНОКПП</th><th>Email</th><th>Телефон</th><th>Статус</th></tr></thead>
        <tbody>${rows.map(r=>{ const c=d.categoriesBy[r.category_id]; return html`<tr key=${r.id} class="click" onClick=${()=>go('counterparties/'+r.id)}>
          <td class="nw"><b>${r.idx||'—'}</b></td><td>${r.name}</td><td class="nw">${c?c.name:'—'}</td><td>${(d.formsBy[r.legal_form_id]||{}).short||'—'}</td>
          <td class="nw">${r.tax_id||'—'}</td><td class="ell" style="max-width:200px">${r.email||'—'}</td><td class="nw">${r.phone||'—'}</td>
          <td>${r.active?html`<${Chip} c="green">Активний<//>`:html`<${Chip}>Неактивний<//>`}</td></tr>`; })}</tbody></table>`}
    </div><${Pager} page=${page} size=${CP_PAGE} total=${total} onPage=${setPage}/></div>
    ${edit&&html`<${CounterpartyForm} row=${edit} onClose=${()=>setEdit(null)} onSaved=${c=>{ setEdit(null); go('counterparties/'+c.id); }}/>`}
    ${imp&&html`<${ImportWizard} kind="counterparties" onClose=${()=>{ setImp(false); setTick(t=>t+1); }}/>`}`;
}

  const loadContracts=async()=>{ const {data,error}=await sb.from('v_contracts').select('id,number,title,status,end_date,indefinite,days_left,project_code,project_name,amount,amount_type,currency_code').eq('counterparty_id',id).order('created_at',{ascending:false}); if(error) toastErr(error); setContracts(data||[]); };

  const cat=d.categoriesBy[c.category_id], form=d.formsBy[c.legal_form_id], legal=can(role,'legal');

  const setTab=t=>setQuery({tab:t});

    </div>
    <${Tabs} value=${tab} onChange=${setTab} items=${[['main','Основне'],['requisites','Реквізити'],['contracts','Договори'+(contracts?' ('+contracts.length+')':'')],['documents','Документи'],['history','Історія']]}/>

        <div class="k">Індекс</div><div class="v">${c.idx?html`<b>${c.idx}</b>`:html`<span class="muted">не присвоєно — оберіть категорію</span>`}</div>
        <div class="k">Категорія</div><div class="v">${cat?cat.name+' ('+cat.prefix+')':'—'}</div>
        <div class="k">Тип (ОПФ)</div><div class="v">${form?form.short+' — '+form.name:'—'}</div>

        <div class="k">Email</div><div class="v">${c.email?html`<a href=${'mailto:'+c.email}>${c.email}</a>`:'—'}</div>
        <div class="k">Телефон</div><div class="v">${c.phone||'—'}</div>
        <div class="k">Статус</div><div class="v">${c.active?'Активний':'Неактивний'}</div>
      </div></div>
      <div class="stack">

          ${contracts===null?html`<p>…</p>`:contracts.length===0?html`<p>Договорів ще немає.</p>`:contracts.slice(0,6).map(r=>html`<div key=${r.id} class="list-row" onClick=${()=>go('contracts/'+r.id)}>

        <div class="card pad"><h3>Контроль дублювання</h3><p class="small">Основний ключ:</p><div class="b" style="margin:6px 0 12px">РНОКПП / ЄДРПОУ</div><p class="small">Індекс не перевикористовується.</p></div>
      </div></div>`}
    ${tab==='requisites'&&html`<div class="card pad" style="max-width:900px"><h3 style="margin-bottom:18px">Реквізити</h3><div class="kv">
      <div class="k">Адреса</div><div class="v">${c.address||'—'}</div>
      <div class="k">IBAN</div><div class="v">${c.iban||'—'}${c.iban&&!checkIban(c.iban)?html`<div class="small" style="color:var(--amber-t)">Контрольна сума IBAN не збігається</div>`:''}</div>

      <tbody>${contracts.map(r=>html`<tr key=${r.id} class="click" onClick=${()=>go('contracts/'+r.id)}><td class="nw"><b>${r.number||'—'}</b></td><td class="ell">${r.title}</td>
        <td class="nw">${r.project_code||r.project_name||'—'}</td><td class="num nw">${fmtAmount(r)}</td><td class="nw">${r.indefinite?'безстроковий':fmtDate(r.end_date)||'—'}</td><td><${StatusChip} s=${r.status}/></td></tr>`)}</tbody></table>`}</div>`}

    ${tab==='history'&&html`<div class="card pad"><${EntityHistory} entity="counterparties" id=${c.id}/></div>`}

function CounterpartyForm({row, onClose, onSaved}){
  const {role, d, reloadDicts} = useCtx();
  const isNew=!row.id;
  const [r,setR]=useState(()=>({active:true, ...row, idx: row.idx||''}));
  const [noTax,setNoTax]=useState(!isNew && !row.tax_id);
  const [dup,setDup]=useState(null); const [errs,setErrs]=useState({}); const [busy,setBusy]=useState(false); const [tried,setTried]=useState(false);
  const [latinTouched,setLatinTouched]=useState(!!row.name_latin);
  const set=(k,v)=>setR(p=>({...p,[k]:v}));
  const form=d.formsBy[r.legal_form_id]; const person=!!(form&&form.person); const isFop=form&&form.short==='ФОП';
  const cat=d.categoriesBy[r.category_id]; const lockedCat=!!row.idx;
  useEffect(()=>{ if(!latinTouched) set('name_latin', translitUA(r.name||'')); },[r.name]);
  useEffect(()=>{ const t=String(r.tax_id||'').replace(/\s/g,''); if(noTax||!/^\d{8,10}$/.test(t)){ setDup(null); return; }
    const h=setTimeout(async()=>{ let x=sb.from('counterparties').select('id,name,idx').eq('tax_id',t); if(r.id) x=x.neq('id',r.id); const {data}=await x.limit(1); setDup(data&&data[0]||null); },300);
    return ()=>clearTimeout(h); },[r.tax_id, noTax]);
  const taxIss = noTax ? null : taxIdIssue(r.tax_id, person);
  const validate=()=>{ const e={};
    if(!(r.name||'').trim()) e.name='Вкажіть назву або ПІБ';
    if(!r.category_id && !(r.idx||'').trim()) e.category='Оберіть категорію';
    if(!r.legal_form_id) e.legal_form='Оберіть ОПФ';
    if(!noTax && !String(r.tax_id||'').trim()) e.tax='Вкажіть код або позначте «Немає коду»';
    if(taxIss&&taxIss.error) e.tax=taxIss.error;
    if(dup) e.tax='Такий код уже є: '+dup.name+(dup.idx?' ('+dup.idx+')':'');
    if(r.email && !checkEmail(r.email)) e.email='Некоректний email';
    if(r.idx && isNew && !/^[A-Za-z]+\d+$/.test(r.idx.trim())) e.idx='Формат: префікс + номер, напр. S187';
    return e; };
  useEffect(()=>{ if(tried) setErrs(validate()); },[r, noTax, dup, tried]);
  const save=async()=>{ setTried(true); const e=validate(); setErrs(e); if(Object.keys(e).length) return; setBusy(true);
    const p={name:r.name.trim(), category_id:r.category_id||null, legal_form_id:r.legal_form_id||null, tax_id:noTax?null:String(r.tax_id||'').replace(/\s/g,'')||null,
      name_latin:(r.name_latin||'').trim()||null, email:(r.email||'').trim()||null, phone:(r.phone||'').trim()||null, address:(r.address||'').trim()||null,
      iban:(r.iban||'').trim()||null, bank_name:(r.bank_name||'').trim()||null, fop_registration:isFop?((r.fop_registration||'').trim()||null):(row.fop_registration||null),
      contact:(r.contact||'').trim()||null, note:(r.note||'').trim()||null, active:r.active!==false};
    if(isNew && can(role,'head') && (r.idx||'').trim()) p.idx=r.idx.trim().toUpperCase();
    if(lockedCat) delete p.category_id;
    const res = isNew ? await sb.from('counterparties').insert(p).select('*').single() : await sb.from('counterparties').update(p).eq('id',row.id).select('*').single();
    setBusy(false);
    if(res.error) return toastErr(res.error);
    pushToast(isNew?'Контрагента створено: '+(res.data.idx||''):'Збережено','ok');
    if(isNew) reloadDicts();
    onSaved(res.data); };
  const del=async()=>{ if(!confirm('Видалити контрагента «'+row.name+'»? Індекс '+(row.idx||'')+' не повернеться в нумерацію.')) return;
    const {error}=await sb.from('counterparties').delete().eq('id',row.id); if(error) return toastErr(error); pushToast('Контрагента видалено','ok'); go('counterparties'); };
  const nextIdx = cat ? cat.prefix+String(cat.next_sequence).padStart(3,'0') : '';
  return html`<${Modal} wide=${true} title=${isNew?'Новий контрагент':'Контрагент '+(row.idx||'')} onClose=${onClose}
    foot=${html`${!isNew&&can(role,'head')&&html`<button class="btn danger" style="margin-right:auto" onClick=${del}>Видалити</button>`}<button class="btn" onClick=${onClose}>Скасувати</button><button class="btn primary" onClick=${save} disabled=${busy}>${busy?html`<${Spinner}/>`:'Зберегти'}</button>`}>
    <div class="row2">
      <${Field} label="Категорія" req=${!r.idx} error=${errs.category} hint=${lockedCat?'Після присвоєння індексу категорія не змінюється':(nextIdx&&!r.idx?'Індекс присвоїться автоматично: '+nextIdx:'')}>
        <${SearchSelect} value=${r.category_id||''} disabled=${lockedCat} options=${d.categories.filter(c=>c.active||c.id===r.category_id).map(c=>({v:c.id,l:c.prefix+' — '+c.name}))} onChange=${v=>set('category_id',v)}/><//>
      ${isNew&&can(role,'head')?html`<${Field} label="Індекс, якщо вже присвоєний раніше" error=${errs.idx} hint="Для перенесення наявних контрагентів. Інакше залиште порожнім"><input value=${r.idx} placeholder="напр. S187" onInput=${e=>set('idx',e.target.value.toUpperCase())}/><//>`
        :html`<${Field} label="Індекс"><input disabled value=${row.idx||'присвоїться після збереження'}/><//>`}
    </div>
    <div class="row2">
      <${Field} label="ОПФ" req error=${errs.legal_form}><${SearchSelect} value=${r.legal_form_id||''} options=${d.forms.filter(f=>f.active||f.id===r.legal_form_id).map(f=>({v:f.id,l:f.short+' — '+f.name}))} onChange=${v=>set('legal_form_id',v)}/><//>
      <${Field} label=${person?'РНОКПП':'ЄДРПОУ / РНОКПП'} req=${!noTax} error=${errs.tax} warn=${taxIss&&taxIss.warn}>
        <input value=${noTax?'':(r.tax_id||'')} disabled=${noTax} inputmode="numeric" onInput=${e=>set('tax_id',e.target.value)}/>
        <div style="margin-top:6px"><${Check} checked=${noTax} onChange=${setNoTax}>Немає коду (іноземний контрагент)<//></div>
        ${dup&&html`<div class="small" style="margin-top:4px"><a href=${'#/counterparties/'+dup.id} onClick=${onClose}>Відкрити наявного контрагента →</a></div>`}<//>
    </div>
    <${Field} label="Назва / ПІБ" req error=${errs.name}><input value=${r.name||''} onInput=${e=>set('name',e.target.value)}/><//>
    <${Field} label="Назва латиницею" hint="Для назви фінального файлу. Заповнюється автоматично — можна виправити"><input value=${r.name_latin||''} onInput=${e=>{ setLatinTouched(true); set('name_latin',e.target.value); }}/><//>
    <div class="row2">
      <${Field} label="Email" error=${errs.email}><input value=${r.email||''} onInput=${e=>set('email',e.target.value)}/><//>
      <${Field} label="Телефон"><input value=${r.phone||''} onInput=${e=>set('phone',e.target.value)}/><//>
    </div>
    <${Field} label="Адреса"><input value=${r.address||''} onInput=${e=>set('address',e.target.value)}/><//>
    <div class="row2">
      <${Field} label="IBAN" warn=${r.iban&&!checkIban(r.iban)?'Контрольна сума IBAN не збігається — перевірте':''}><input value=${r.iban||''} onInput=${e=>set('iban',e.target.value)}/><//>
      <${Field} label="Банк"><input value=${r.bank_name||''} onInput=${e=>set('bank_name',e.target.value)}/><//>
    </div>
    ${isFop&&html`<${Field} label="Реєстрація ФОП" hint="Дата і номер запису в ЄДР"><input value=${r.fop_registration||''} onInput=${e=>set('fop_registration',e.target.value)}/><//>`}
    <div class="row2">
      <${Field} label="Контактна особа"><input value=${r.contact||''} onInput=${e=>set('contact',e.target.value)}/><//>
      <${Field} label="Примітка"><input value=${r.note||''} onInput=${e=>set('note',e.target.value)}/><//>
    </div>
    ${!isNew&&html`<${Check} checked=${r.active!==false} onChange=${v=>set('active',v)}>Активний (неактивні не пропонуються в нових договорах)<//>`}
  <//>`;
}

function Libraries({tab}){
  const items=[['projects','Проєкти'],['categories','Категорії контрагентів'],['forms','ОПФ'],['types','Типи договорів'],['docTypes','Типи документів'],['subjects','Предмети'],['clauses','Положення']];

function DictModal({def, row, onClose, onSaved}){
  const isNew=!row.id;
  const [r,setR]=useState(()=>({active:true, ...row})); const [errs,setErrs]=useState({}); const [busy,setBusy]=useState(false);
  const set=(k,v)=>setR(p=>({...p,[k]:v}));
  const save=async()=>{ const e={};
    def.fields.forEach(f=>{ const v=r[f.k]; if(f.type==='check') return; const s=v==null?'':String(v).trim();
      if(f.req && !s) e[f.k]='Обов’язкове поле'; else if(s && f.re && !f.re.test(s)) e[f.k]=f.reMsg; });
    setErrs(e); if(Object.keys(e).length) return; setBusy(true);
    const p={active:r.active!==false};
    def.fields.forEach(f=>{ if(!isNew && f.lockOnEdit) return; let v=r[f.k]; if(f.type==='check') v=!!v; else { v=v==null?'':String(v).trim(); if(f.upper) v=v.toUpperCase(); v=v||null; } p[f.k]=v; });
    const res = isNew ? await sb.from(def.table).insert(p) : await sb.from(def.table).update(p).eq('id',row.id);
    setBusy(false); if(res.error) return toastErr(res.error); pushToast('Збережено','ok'); onSaved(); };
  const del=async()=>{ if(!confirm('Видалити запис? Якщо він уже використовується, система не дасть видалити — тоді зробіть його неактивним.')) return;
    const {error}=await sb.from(def.table).delete().eq('id',row.id); if(error) return toastErr(error); pushToast('Видалено','ok'); onSaved(); };
  const renderF = f => html`<${Field} key=${f.k} label=${f.type==='check'?'':f.l} req=${f.req} error=${errs[f.k]} hint=${f.hint}>
    ${f.type==='check'?html`<${Check} checked=${!!r[f.k]} onChange=${v=>set(f.k,v)}>${f.l}<//>`
      :html`<input type=${f.type||'text'} value=${r[f.k]||''} disabled=${!isNew&&f.lockOnEdit} onInput=${e=>set(f.k, f.upper?e.target.value.toUpperCase():e.target.value)}/>`}<//>`;
  const parts=[];
  for(let i=0;i<def.fields.length;i++){ const f=def.fields[i], g=def.fields[i+1];
    if(f.half && g && g.half){ parts.push(html`<div class="row2" key=${f.k}>${renderF(f)}${renderF(g)}</div>`); i++; } else parts.push(renderF(f)); }
  return html`<${Modal} title=${(isNew?'Новий запис':'Редагування')+' — '+def.t.toLowerCase()} onClose=${onClose}
    foot=${html`${!isNew&&html`<button class="btn danger" style="margin-right:auto" onClick=${del}>Видалити</button>`}<button class="btn" onClick=${onClose}>Скасувати</button><button class="btn primary" onClick=${save} disabled=${busy}>Зберегти</button>`}>
    ${parts}
    ${!isNew&&html`<${Check} checked=${r.active!==false} onChange=${v=>set('active',v)}>Активний (неактивні не пропонуються в нових договорах)<//>`}
  <//>`;
}

const normH = s => fold(String(s||'')).replace(/[^\p{L}\p{N}#]+/gu,' ').trim();
function autoMap(headers, fields){
  const map={}, used=new Set(), H=headers.map(normH);
  fields.forEach(f=>{ const cands=[f.l,...f.syn].map(normH); const i=H.findIndex((h,j)=>!used.has(j)&&h&&cands.includes(h)); if(i>=0){ map[f.k]=i; used.add(i); } });
  fields.forEach(f=>{ if(map[f.k]!=null) return; const cands=f.syn.map(normH).filter(s=>s.length>2); const i=H.findIndex((h,j)=>!used.has(j)&&h&&cands.some(s=>h.includes(s))); if(i>=0){ map[f.k]=i; used.add(i); } });
  return map;
}
const isoLocal = d => new Date(d.getFullYear(), d.getMonth(), d.getDate(), 12).toISOString().slice(0,10);
function cellStr(v, k){
  if(v==null) return '';
  if(v instanceof Date) return isNaN(v) ? '' : isoLocal(v);
  if(typeof v==='number'){ if(k==='tax_id'){ const s=String(Math.round(v)); return s.length>=5&&s.length<8 ? s.padStart(8,'0') : s; } return String(v); }
  return String(v).trim();
}
function parseDate(s){
  if(!s) return {v:''};
  if(/^\d{4}-\d{2}-\d{2}$/.test(s)) return {v:s};
  const m=s.match(/^(\d{1,2})[./-](\d{1,2})[./-](\d{2,4})$/);
  if(m){ const y=m[3].length===2?'20'+m[3]:m[3]; const iso=y+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0'); if(!isNaN(new Date(iso+'T12:00:00'))) return {v:iso}; }
  return {err:'незрозуміла дата «'+s+'»'};
}

async function inChunks(values, fn){ const out=[]; const u=[...new Set(values.filter(Boolean))]; for(let i=0;i<u.length;i+=150){ out.push(...await fn(u.slice(i,i+150))); } return out; }
async function validateCounterpartyRows(out, d){

  const seenTax={}, seenIdx={};
  out.forEach(r=>{ const x=r.data;
    x.name=(x.name||'').trim(); if(!x.name) r.errs.push('порожня назва');
    x.idx=(x.idx||'').toUpperCase().replace(/\s/g,''); x.category=(x.category||'').toUpperCase().trim();
    if(x.idx){ const m=x.idx.match(/^([A-Z]+)(\d+)$/); if(!m) r.errs.push('індекс «'+x.idx+'» має бути ПРЕФІКС+номер'); else if(!catBy[m[1]]) r.errs.push('немає категорії з префіксом '+m[1]); else if(x.category&&x.category!==m[1]) r.errs.push('індекс не відповідає категорії '+x.category); }
    if(x.category && !catBy[x.category]) r.errs.push('немає категорії «'+x.category+'»');
    if(!x.idx && !x.category) r.errs.push('потрібна категорія або індекс');
    const form = x.legal_form ? formBy[x.legal_form.toLowerCase()] : null;
    if(x.legal_form && !form) r.errs.push('невідома ОПФ «'+x.legal_form+'»');
    x.tax_id=(x.tax_id||'').replace(/\s/g,'');
    if(x.tax_id){ const iss=taxIdIssue(x.tax_id, form&&form.person); if(iss&&iss.error) r.errs.push('код: '+iss.error); else if(iss&&iss.warn) r.warns.push(iss.warn); }
    else r.warns.push('без коду дублікати не відстежуються');
    if(x.email && !checkEmail(x.email)) r.warns.push('email виглядає некоректно');
    if(x.iban && !checkIban(x.iban)) r.warns.push('IBAN: контрольна сума не збігається');
    if(x.tax_id){ if(seenTax[x.tax_id]) r.errs.push('дубль коду в файлі (рядок '+seenTax[x.tax_id]+')'); else seenTax[x.tax_id]=r.row; }
    if(x.idx){ if(seenIdx[x.idx]) r.errs.push('дубль індексу в файлі (рядок '+seenIdx[x.idx]+')'); else seenIdx[x.idx]=r.row; }
  });
  const byTax = Object.fromEntries((await inChunks(out.map(r=>r.data.tax_id), async ch=>{ const {data,error}=await sb.from('counterparties').select('id,name,idx,tax_id').in('tax_id',ch); if(error) throw error; return data; })).map(c=>[c.tax_id,c]));
  const byIdx = Object.fromEntries((await inChunks(out.map(r=>r.data.idx), async ch=>{ const {data,error}=await sb.from('counterparties').select('id,name,idx,tax_id').in('idx',ch); if(error) throw error; return data; })).map(c=>[c.idx,c]));
  out.forEach(r=>{ const x=r.data; const ex=x.tax_id&&byTax[x.tax_id];
    if(ex){ r.existing='(є: '+ex.name+(ex.idx?', '+ex.idx:'')+')'; if(!r.errs.length) r.status='exists'; }
    const exi=x.idx&&byIdx[x.idx]; if(exi && (!ex || exi.id!==ex.id)) r.errs.push('індекс '+x.idx+' уже має «'+exi.name+'»');
    if(r.errs.length) r.status='error';
  });
}
async function validateProjectRows(out, d){
  const byCode=Object.fromEntries(d.projects.filter(p=>p.short_code).map(p=>[p.short_code.toUpperCase(),p]));
  const byName=Object.fromEntries(d.projects.map(p=>[p.full_name.toLowerCase(),p]));
  const seen={};
  out.forEach(r=>{ const x=r.data;
    x.full_name=(x.full_name||'').trim(); if(!x.full_name) r.errs.push('порожня назва');
    x.short_code=(x.short_code||'').trim(); if(x.short_code && !/^[A-Za-z0-9#._-]{1,30}$/.test(x.short_code)) r.errs.push('код: лише латиниця, цифри, # . _ -');
    ['start_date','end_date'].forEach(k=>{ if(x[k]){ const p=parseDate(x[k]); if(p.err) r.errs.push(p.err); else x[k]=p.v; } });
    if(x.start_date && x.end_date && x.end_date<x.start_date) r.errs.push('завершення раніше за початок');
    const key=x.short_code?x.short_code.toUpperCase():'#'+x.full_name.toLowerCase();
    if(seen[key]) r.errs.push('дубль у файлі (рядок '+seen[key]+')'); else seen[key]=r.row;
    const ex = x.short_code ? byCode[x.short_code.toUpperCase()] : byName[x.full_name.toLowerCase()];
    if(ex){ r.existing='(є: '+projectLabel(ex)+')'; if(!r.errs.length) r.status='exists'; }
    if(r.errs.length) r.status='error';
  });
}

               can(role,'head')&&['imports','Пакети імпорту'], can(role,'admin')&&['vchasno','Вчасно']].filter(Boolean);
  const t = items.some(i=>i[0]===tab) ? tab : 'profile';
  return html`<div class="head"><div><h1>Налаштування</h1><p>Профіль, користувачі, журнал змін</p></div></div>
    <${Tabs} value=${t} onChange=${x=>setQuery({tab:x})} items=${items}/>
    ${t==='profile'&&html`<${MyProfile}/>`}
    ${t==='users'&&html`<${UsersTab}/>`}
    ${t==='journal'&&html`<${JournalTab}/>`}

    ${t==='vchasno'&&html`<div class="card pad" style="max-width:760px"><p style="color:var(--text);line-height:1.6">Підключення Вчасно з’явиться на етапі 4: персональні API-токени користувачів (зберігаються зашифровано), профілі підписання, інтервал автосинхронізації та журнал обміну.</p></div>`}`;
}

  const [name,setName]=useState(me.full_name||''); const [busy,setBusy]=useState(false);
  const save=async()=>{ setBusy(true); const {error}=await sb.rpc('update_my_profile',{p_full_name:name}); setBusy(false); if(error) return toastErr(error); pushToast('Збережено','ok'); reloadDicts(); reloadMe(); };
  return html`<div class="card pad" style="max-width:560px">
    <${Field} label="Email"><input disabled value=${me.email||''}/><//>
    <${Field} label="Роль"><input disabled value=${roleL[role]}/><//>
    <${Field} label="ПІБ" hint="Показується в реєстрі як «юрист» і в журналі змін"><input value=${name} onInput=${e=>setName(e.target.value)}/><//>
    <button class="btn primary" onClick=${save} disabled=${busy}>Зберегти</button>
  </div>`;
}
function UsersTab(){
  const {d, me, reloadDicts} = useCtx();
  const [edit,setEdit]=useState(null);
  return html`<div class="note" style="margin-bottom:14px">Нового користувача створює адміністратор у Supabase: Authentication → Users → Add user → Create new user (з галочкою Auto Confirm User). Після першого входу він з’явиться тут — призначте йому роль. Поки роль не призначено, користувач бачить «Доступ ще не надано».</div>
    <div class="card"><table>
      <thead><tr><th>Email</th><th>ПІБ</th><th>Роль</th><th>Доступ</th></tr></thead>
      <tbody>${d.users.map(u=>html`<tr key=${u.id} class="click" onClick=${()=>setEdit(u)}><td>${u.email}${u.id===me.id?html` <span class="muted small">(ви)</span>`:''}</td><td>${u.full_name||html`<span class="muted">—</span>`}</td>
        <td>${u.role==='none'?html`<${Chip} c="amber">Без доступу<//>`:roleL[u.role]||u.role}</td><td>${u.active===false?html`<${Chip} c="red">Вимкнено<//>`:html`<${Chip} c="green">Увімкнено<//>`}</td></tr>`)}</tbody></table></div>
    <div class="card pad" style="margin-top:16px"><h3>Що може кожна роль</h3><table class="small"><tbody>
      <tr><td class="b nw">Адміністратор</td><td>Усе, зокрема користувачі й ролі, журнал, імпорт</td></tr>
      <tr><td class="b nw">Діловод / керівник юр. напряму</td><td>Усі юридичні права, технічна зміна номера з причиною, імпорт, журнал</td></tr>
      <tr><td class="b nw">Юрист</td><td>Картки договорів, контрагенти, довідники, статуси, файли</td></tr>
      <tr><td class="b nw">Головний бухгалтер</td><td>Повний реєстр; змінює лише суму, валюту і тип суми</td></tr>
      <tr><td class="b nw">Бухгалтер</td><td>Лише договори з масових пакетів (масове контрактування — етап 3), без юридичного редагування</td></tr>
      <tr><td class="b nw">Директорка</td><td>Лише перегляд: реєстр, картки, файли, статуси</td></tr>
    </tbody></table></div>
    ${edit&&html`<${UserModal} u=${edit} onClose=${()=>setEdit(null)} onSaved=${()=>{ setEdit(null); reloadDicts(); }}/>`}`;
}
function UserModal({u, onClose, onSaved}){
  const {me} = useCtx();
  const [role,setRole]=useState(u.role); const [active,setActive]=useState(u.active!==false); const [name,setName]=useState(u.full_name||''); const [busy,setBusy]=useState(false);
  const save=async()=>{ setBusy(true); const {error}=await sb.rpc('admin_update_user',{p_user:u.id, p_role:role, p_active:active, p_full_name:name}); setBusy(false);
    if(error) return toastErr(error); pushToast('Збережено','ok'); onSaved(); };
  return html`<${Modal} title=${u.email} onClose=${onClose} foot=${html`<button class="btn" onClick=${onClose}>Скасувати</button><button class="btn primary" onClick=${save} disabled=${busy}>Зберегти</button>`}>
    <${Field} label="ПІБ"><input value=${name} onInput=${e=>setName(e.target.value)}/><//>
    <${Field} label="Роль"><select value=${role} disabled=${u.id===me.id} onChange=${e=>setRole(e.target.value)}>${ROLES.map(r=>html`<option value=${r.v}>${r.l}</option>`)}</select><//>
    <${Check} checked=${active} disabled=${u.id===me.id} onChange=${setActive}>Доступ увімкнено<//>
    ${u.id===me.id&&html`<p class="small" style="margin-top:10px">Власну роль і доступ змінити не можна.</p>`}
  <//>`;
}
function JournalTab(){
  const {d} = useCtx();
  const [f,setF]=useState({entity:'', actor:'', from:'', to:''}); const [page,setPage]=useState(0); const [rows,setRows]=useState(null); const [total,setTotal]=useState(null);
  const PG=50;
  useEffect(()=>{ let dead=false; let q=sb.from('audit_log').select('*',{count:'exact'}).order('at',{ascending:false});
    if(f.entity) q=q.eq('entity',f.entity); if(f.actor) q=q.eq('actor',f.actor);
    if(f.from) q=q.gte('at', f.from+'T00:00:00'); if(f.to) q=q.lte('at', f.to+'T23:59:59');
    q.range(page*PG, page*PG+PG-1).then(({data,count,error})=>{ if(dead) return; if(error){toastErr(error); setRows([]); return;} setRows(data); setTotal(count); });
    return ()=>{ dead=true; }; },[JSON.stringify(f), page]);
  const set=(k,v)=>{ setF({...f,[k]:v}); setPage(0); };
  return html`<div class="card filters" style="padding-bottom:4px">
      <${Field} label="Об’єкт"><${SearchSelect} value=${f.entity} options=${Object.entries(ENTITY_L).map(([v,l])=>({v,l}))} onChange=${v=>set('entity',v)} placeholder="Усі"/><//>
      <${Field} label="Користувач"><${SearchSelect} value=${f.actor} options=${d.users.map(u=>({v:u.id,l:userLabel(u)}))} onChange=${v=>set('actor',v)} placeholder="Усі"/><//>
      <${Field} label="З дати"><input type="date" value=${f.from} onInput=${e=>set('from',e.target.value)}/><//>
      <${Field} label="По дату"><input type="date" value=${f.to} onInput=${e=>set('to',e.target.value)}/><//>
    </div>
    <div class="card pad">${rows===null?html`<${Loading}/>`:html`<${HistoryItems} entries=${rows} showEntity=${true}/>`}</div>
    <div class="card" style="margin-top:10px"><${Pager} page=${page} size=${PG} total=${total} onPage=${setPage}/></div>`;
}
function ImportsTab(){
  const {d, reloadDicts} = useCtx();
  const [rows,setRows]=useState(null);
  const load=async()=>{ const {data,error}=await sb.from('import_batches').select('*').order('created_at',{ascending:false}); if(error) toastErr(error); setRows(data||[]); };
  useEffect(()=>{ load(); },[]);
  const rollback=async b=>{ if(!confirm('Скасувати пакет «'+(b.file_name||'')+'»? Створені ним записи буде видалено (якщо вони ще не використані в договорах). Доповнені поля не повертаються.')) return;
    const {data,error}=await sb.rpc('rollback_import',{p_batch:b.id}); if(error) return toastErr(error); pushToast('Пакет скасовано, видалено записів: '+(data&&data.deleted||0),'ok'); load(); reloadDicts(); };
  const report=b=>exportRows(b.report||[], [{l:'Рядок', x:r=>r.row}, {l:'Назва', x:r=>r.name||''}, {l:'Результат', x:r=>({created:'створено',updated:'доповнено',skipped:'пропущено (уже є)',error:'помилка'})[r.status]||r.status},
    {l:'Індекс', x:r=>r.idx||''}, {l:'Системний ID', x:r=>r.id||''}, {l:'Примітка', x:r=>r.message||''}], 'Звіт імпорту '+fmtTs(b.created_at).replace(/\./g,'-'), 'xlsx');
  return html`<div class="card">${rows===null?html`<${Loading}/>`:rows.length===0?html`<${Empty} title="Імпортів ще не було">Імпорт контрагентів — у розділі «Контрагенти», проєктів — у «Бібліотеки → Проєкти».<//>`:html`<table>
    <thead><tr><th>Дата</th><th>Що</th><th>Файл</th><th>Хто</th><th>Результат</th><th></th></tr></thead>
    <tbody>${rows.map(b=>{ const s=b.stats||{}; return html`<tr key=${b.id}><td class="nw">${fmtDT(b.created_at)}</td><td>${b.kind==='counterparties'?'Контрагенти':'Проєкти'}</td><td class="ell">${b.file_name||'—'}</td>
      <td class="nw">${userLabel(d.usersBy[b.created_by])||'—'}</td>
      <td class="small">створено ${s.created||0} · доповнено ${s.updated||0} · пропущено ${s.skipped||0} · помилок ${s.errors||0}${b.rolled_back_at?html` <${Chip} c="red">скасовано<//>`:''}</td>
      <td class="nw" style="text-align:right"><button class="btn sm" onClick=${()=>report(b)}>Звіт</button> ${!b.rolled_back_at&&html`<button class="btn sm danger" onClick=${()=>rollback(b)}>Скасувати</button>`}</td></tr>`; })}</tbody></table>`}</div>`;
}
